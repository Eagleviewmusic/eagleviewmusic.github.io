<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Drum Kit - Eagle View Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        try {
            if (window.self !== window.top) {
                document.documentElement.classList.add('in-iframe');
            }
        } catch (e) {
            document.documentElement.classList.add('in-iframe');
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Comic / Cartoon Ink Outlines (matches PNG line art) */
            --ink-dark: #1C2B36;
            --ink-shadow: #121D24;
            
            /* Drumhead Cream & Warm Pastels from the PNG illustrations */
            --cream-head: #FDF6E7;
            --cream-card: #F8EED8;
            --cream-card-hover: #FFFDF7;
            --cream-dark: #E6D7BD;
            
            /* Cartoon Silver & Metal Greys from drum rims/stands */
            --silver-metal: #7B8F9C;
            --silver-light: #DCE5EB;
            --silver-dark: #586B77;
            
            /* Cartoon Chassis & Page Background */
            --rack-chassis: #2E3B47;
            --rack-chassis-top: #3D4C5A;
            --rack-ear: #4A5B69;
            --bg-page: #232D37;
            
            /* Fun Retro Indie Cartoon Accents */
            --cymbal-yellow: #F5C542;
            --clap-coral: #FF7B54;
            --indie-teal: #4ECDC4;
            --led-glow: rgba(245, 197, 66, 0.6);
        }
        
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            color: var(--cream-head);
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            touch-action: manipulation;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Playful cartoon comic halftone dot pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 2px, transparent 2px);
            background-size: 26px 26px;
            z-index: -1;
            opacity: 0.8;
        }
        
        /* 19" Cartoon Rack Unit Frame with Chunky Ears */
        .rack-frame {
            display: flex;
            align-items: stretch;
            max-width: 1060px;
            width: 100%;
            position: relative;
            z-index: 3;
            border: 4px solid var(--ink-dark);
            border-radius: 24px;
            background: var(--rack-chassis);
            box-shadow: 0 10px 0 var(--ink-shadow), 0 25px 35px rgba(0, 0, 0, 0.4);
        }
        
        /* Playful Cartoon Rack Mounting Ears */
        .rack-ear {
            width: 44px;
            background: var(--rack-ear);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            position: relative;
            flex-shrink: 0;
        }
        
        .rack-ear-left {
            border-radius: 20px 0 0 20px;
            border-right: 4px solid var(--ink-dark);
        }
        
        .rack-ear-right {
            border-radius: 0 20px 20px 0;
            border-left: 4px solid var(--ink-dark);
        }
        
        /* Chunky Cartoon Rack Screws */
        .rack-screw {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--silver-light);
            border: 3px solid var(--ink-dark);
            box-shadow: inset 0 -2px 0 var(--silver-dark), 0 2px 0 rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .rack-screw::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 3px;
            background: var(--ink-dark);
            border-radius: 2px;
        }
        
        .rack-screw::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 10px;
            background: var(--ink-dark);
            border-radius: 2px;
        }
        
        .rack-screw.bottom {
            transform: rotate(30deg);
        }
        .rack-screw.top {
            transform: rotate(-20deg);
        }
        
        /* Main Rack Chassis Panel */
        .rack-chassis {
            flex: 1;
            padding: 26px 30px 32px;
            background: linear-gradient(180deg, var(--rack-chassis-top) 0%, var(--rack-chassis) 100%);
            position: relative;
            overflow: visible;
            border-radius: 0;
        }
        
        /* Vintage Cartoon Rack Header Panel */
        .rack-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 3px dashed rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 100;
        }
        
        .rack-brand {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: transform 0.15s ease;
        }
        
        .rack-brand:hover {
            transform: scale(1.02);
        }
        
        .rack-title {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--cream-head);
            letter-spacing: 1px;
            text-shadow: 3px 3px 0 var(--ink-dark);
            margin: 0;
            line-height: 1.1;
        }
        
        .rack-subtitle {
            font-family: 'DM Mono', monospace, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--cymbal-yellow);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 1.5px 1.5px 0 var(--ink-dark);
        }
        
        .rack-panel-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .voice-selector-wrapper {
            position: relative;
            display: inline-block;
            z-index: 101;
        }
        
        .rack-status {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--ink-dark);
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid var(--ink-dark);
            box-shadow: 0 3px 0 var(--ink-shadow);
        }
        
        .voice-btn {
            cursor: pointer;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
        }
        
        .voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink-shadow);
            background: #253745;
        }
        
        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink-shadow);
        }
        
        .voice-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cream-head);
            letter-spacing: 1px;
        }
        
        .voice-arrow {
            font-size: 0.65rem;
            color: var(--cymbal-yellow);
            transition: transform 0.15s ease;
            line-height: 1;
        }
        
        .voice-btn[aria-expanded="true"] .voice-arrow {
            transform: rotate(180deg);
        }
        
        .voice-popover {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 1000;
            background: var(--cream-card);
            border: 3.5px solid var(--ink-dark);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 6px 0 var(--ink-dark), 0 12px 28px rgba(0,0,0,0.35);
            width: 190px;
            animation: popover-slide-in 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .voice-popover::before {
            content: '';
            position: absolute;
            top: -9px;
            right: 30px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 9px solid var(--ink-dark);
        }
        
        .voice-popover::after {
            content: '';
            position: absolute;
            top: -4px;
            right: 31px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 7px solid var(--cream-card);
        }
        
        .voice-popover.is-open {
            display: block;
        }
        
        @keyframes popover-slide-in {
            0% { transform: translateY(-8px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .voice-popover-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--ink-dark);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .voice-options-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        
        .voice-option-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--ink-dark);
            background: var(--silver-light);
            border: 2px solid var(--ink-dark);
            border-radius: 8px;
            padding: 6px 0;
            box-shadow: 0 2px 0 var(--ink-dark);
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
            outline: none;
        }
        
        .voice-option-btn:hover {
            transform: translateY(-2px);
            background: var(--cymbal-yellow);
            box-shadow: 0 4px 0 var(--ink-dark);
        }
        
        .voice-option-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }
        
        .voice-option-btn.is-active {
            background: var(--cymbal-yellow);
            box-shadow: 0 1px 0 var(--ink-dark);
            border-color: var(--ink-dark);
        }
        
        /* BPM Tempo Selector & Popover */
        .bpm-selector-wrapper {
            position: relative;
            display: inline-block;
            z-index: 101;
        }

        .bpm-btn {
            cursor: pointer;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
        }

        .bpm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink-shadow);
            background: #253745;
        }

        .bpm-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink-shadow);
        }

        .bpm-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cream-head);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .bpm-arrow {
            font-size: 0.65rem;
            color: var(--cymbal-yellow);
            transition: transform 0.15s ease;
            line-height: 1;
        }

        .bpm-btn[aria-expanded="true"] .bpm-arrow {
            transform: rotate(180deg);
        }

        .bpm-popover {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 1000;
            background: var(--cream-card);
            border: 3.5px solid var(--ink-dark);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 6px 0 var(--ink-dark), 0 12px 28px rgba(0,0,0,0.35);
            width: 224px;
            animation: popover-slide-in 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bpm-popover::before {
            content: '';
            position: absolute;
            top: -9px;
            right: 32px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 9px solid var(--ink-dark);
        }

        .bpm-popover::after {
            content: '';
            position: absolute;
            top: -4px;
            right: 33px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 7px solid var(--cream-card);
        }

        .bpm-popover.is-open {
            display: block;
        }

        .bpm-popover-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--ink-dark);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .bpm-display-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 10px;
        }

        .bpm-value-input {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--ink-dark);
            background: #FFF;
            border: 2.5px solid var(--ink-dark);
            border-radius: 8px;
            padding: 2px 4px;
            width: 58px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
            line-height: 1.1;
            outline: none;
            -moz-appearance: textfield;
            transition: border-color 0.12s ease;
        }

        .bpm-value-input::-webkit-outer-spin-button,
        .bpm-value-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bpm-value-input:focus {
            border-color: #FF7B54;
            background: #FFFDF8;
        }

        .bpm-step-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--ink-dark);
            background: var(--silver-light);
            border: 2px solid var(--ink-dark);
            border-radius: 7px;
            padding: 4px 6px;
            min-width: 28px;
            height: 29px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 var(--ink-dark);
            cursor: pointer;
            transition: transform 0.08s ease, background 0.1s ease, box-shadow 0.08s ease;
            outline: none;
            user-select: none;
        }

        .bpm-step-btn:hover {
            transform: translateY(-1px);
            background: var(--cymbal-yellow);
            box-shadow: 0 3px 0 var(--ink-dark);
        }

        .bpm-step-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        .bpm-slider-row {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .bpm-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--silver-metallic);
            border: 2px solid var(--ink-dark);
            outline: none;
            cursor: pointer;
        }

        .bpm-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cymbal-yellow);
            border: 2.5px solid var(--ink-dark);
            box-shadow: 0 2px 0 var(--ink-dark);
            cursor: grab;
            transition: transform 0.1s ease;
        }

        .bpm-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
            background: #FF7B54;
        }

        .bpm-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cymbal-yellow);
            border: 2.5px solid var(--ink-dark);
            box-shadow: 0 2px 0 var(--ink-dark);
            cursor: grab;
        }

        .bpm-presets-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--ink-dark);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 6px;
            opacity: 0.75;
        }

        .bpm-presets-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }

        .bpm-preset-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--ink-dark);
            background: var(--silver-light);
            border: 2px solid var(--ink-dark);
            border-radius: 6px;
            padding: 4px 0;
            box-shadow: 0 2px 0 var(--ink-dark);
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
            outline: none;
        }

        .bpm-preset-btn:hover {
            transform: translateY(-1px);
            background: var(--cymbal-yellow);
            box-shadow: 0 3px 0 var(--ink-dark);
        }

        .bpm-preset-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        .bpm-preset-btn.is-active {
            background: var(--cymbal-yellow);
            box-shadow: 0 1px 0 var(--ink-dark);
            border-color: var(--ink-dark);
        }

        .bpm-tap-btn {
            width: 100%;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--ink-dark);
            background: #FF7B54;
            border: 2.5px solid var(--ink-dark);
            border-radius: 10px;
            padding: 7px 0;
            box-shadow: 0 3px 0 var(--ink-dark);
            cursor: pointer;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bpm-tap-btn:hover {
            background: #FF8F6B;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 var(--ink-dark);
        }

        .bpm-tap-btn:active, .bpm-tap-btn.tap-flash {
            background: var(--cymbal-yellow);
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }
        
        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--cymbal-yellow);
            border: 1.5px solid var(--ink-dark);
            box-shadow: 0 0 8px var(--led-glow);
            transition: transform 0.08s ease, background 0.08s ease;
        }
        
        .status-led.pulse {
            transform: scale(1.5);
            background: #FFF;
            box-shadow: 0 0 14px #FFF;
        }
        
        .rack-badge {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--ink-dark);
            background: var(--silver-light);
            border: 2.5px solid var(--ink-dark);
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 3px 0 var(--ink-dark);
            text-transform: uppercase;
        }
        
        .rearrange-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, color 0.15s ease;
        }
        
        .rearrange-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink-dark);
            background: #EDF3F7;
        }
        
        .rearrange-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }
        
        .rearrange-btn.is-active {
            background: var(--cymbal-yellow);
            color: var(--ink-dark);
            box-shadow: 0 3px 0 var(--ink-dark);
            animation: cartoon-pulse 1.2s infinite alternate ease-in-out;
        }
        
        @keyframes cartoon-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .play-stop-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 31px;
            padding: 0;
            border-radius: 20px;
            color: var(--ink-dark);
            background: var(--silver-light);
            border: 2.5px solid var(--ink-dark);
            box-shadow: 0 3px 0 var(--ink-dark);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, color 0.15s ease;
        }

        .play-stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink-dark);
            background: #EDF3F7;
        }

        .play-stop-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        .play-stop-btn.is-playing {
            background: #FF7B54;
            color: #FFF;
            box-shadow: 0 3px 0 var(--ink-dark);
        }

        .play-stop-btn.is-playing:hover {
            background: #FF6233;
            color: #FFF;
        }

        .play-stop-btn .stop-icon {
            display: none;
        }

        .play-stop-btn.is-playing .play-icon {
            display: none;
        }

        .play-stop-btn.is-playing .stop-icon {
            display: block;
        }
        
        /* Drum Pads Grid */
        .drum-pads {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Dynamic Voice Grid Configurations */
        .drum-pads[data-voices="1"] {
            grid-template-columns: 1fr;
            max-width: 260px;
        }
        .drum-pads[data-voices="2"] {
            grid-template-columns: repeat(2, 1fr);
            max-width: 480px;
        }
        .drum-pads[data-voices="3"] {
            grid-template-columns: repeat(3, 1fr);
            max-width: 700px;
        }
        .drum-pads[data-voices="4"] {
            grid-template-columns: repeat(2, 1fr);
            max-width: 480px;
        }
        .drum-pads[data-voices="5"] {
            grid-template-columns: repeat(5, 1fr);
        }
        .drum-pads[data-voices="6"] {
            grid-template-columns: repeat(3, 1fr);
            max-width: 720px;
        }
        .drum-pads[data-voices="7"] {
            grid-template-columns: repeat(4, 1fr);
            max-width: 900px;
        }
        .drum-pads[data-voices="8"] {
            grid-template-columns: repeat(4, 1fr);
            max-width: 900px;
        }
        .drum-pads[data-voices="9"] {
            grid-template-columns: repeat(5, 1fr);
        }
        .drum-pads[data-voices="10"] {
            grid-template-columns: repeat(5, 1fr);
        }
        
        .drum-pad {
            position: relative;
            border: 3.5px solid var(--ink-dark);
            color: var(--ink-dark);
            padding: 8px;
            text-align: center;
            font-size: 28px;
            cursor: pointer;
            border-radius: 18px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.1s ease, 
                        background 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            
            height: 15vh;
            min-height: 145px;
            max-height: 185px;
            
            /* Warm vintage drumhead cream cartoon card - matches PNG fills perfectly! */
            background: var(--cream-card);
            box-shadow: 0 6px 0 var(--ink-dark);
        }
        
        .drum-pad:hover {
            transform: translateY(-2px);
            background: var(--cream-card-hover);
            box-shadow: 0 8px 0 var(--ink-dark);
        }
        
        .drum-pad:active, .drum-pad.active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--ink-dark);
            background: #FCEBC7;
            animation: cartoon-pop 0.22s ease-out;
        }
        
        @keyframes cartoon-pop {
            0% { transform: translateY(4px) scale(0.96); }
            50% { transform: translateY(-2px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }
        
        /* Full-size drum image that fills the entire pad */
        .drum-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            border-radius: 14px;
            overflow: hidden;
            padding: 8px 10px 38px 10px;
        }
        
        .drum-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.12s ease;
            filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.15));
        }
        
        .drum-pad:hover .drum-image img {
            transform: scale(1.05) rotate(-2deg);
        }
        
        .drum-pad.active .drum-image img {
            transform: scale(1.1) rotate(2deg);
        }
        
        /* Chunky cartoon sound info bar */
        .sound-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 3;
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--cream-head);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: var(--ink-dark);
            border-top: 3px solid var(--ink-dark);
            border-radius: 0 0 14px 14px;
            box-sizing: border-box;
        }
        
        .sound-label {
            color: var(--cream-head);
        }
        
        /* Chunky cartoon pad number badge */
        .pad-number {
            font-family: 'Fredoka', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: var(--ink-dark);
            background: var(--cymbal-yellow);
            border: 2px solid var(--ink-dark);
            padding: 1px 7px;
            border-radius: 6px;
            box-shadow: 1px 1px 0 var(--ink-dark);
            line-height: 1.2;
        }
        
        .drum-pad:hover .pad-number {
            background: #FFE066;
            transform: scale(1.08);
        }
        
        /* Cartoon Comic Pop Waves */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(245, 197, 66, 0.4);
            border: 3px solid var(--ink-dark);
            transform: scale(0);
            animation: cartoon-ripple 0.4s ease-out;
            z-index: 4;
            pointer-events: none;
        }
        
        @keyframes cartoon-ripple {
            to { transform: scale(3); opacity: 0; }
        }
        
        /* Cartoon comic stars / sparks */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            border: 1.5px solid var(--ink-dark);
            transform: translate(-50%, -50%);
            opacity: 0;
            box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.25);
        }
        
        @keyframes cartoon-particle {
            0% { 
                transform: translate(-50%, -50%) translate(0, 0) scale(0.5); 
                opacity: 1; 
            }
            35% {
                transform: translate(-50%, -50%) translate(calc(var(--dx, 0px) * 0.4), calc(var(--dy, -30px) * 0.4)) scale(1.25);
                opacity: 1;
            }
            100% { 
                transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, -30px)) scale(0.2); 
                opacity: 0; 
            }
        }
        
        /* Rearrange Navigation Arrows */
        .pad-arrow {
            display: none;
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--cream-card);
            border: 2.5px solid var(--ink-dark);
            box-shadow: 0 3px 0 var(--ink-dark);
            font-size: 13px;
            font-weight: 900;
            font-family: 'Fredoka', sans-serif;
            color: var(--ink-dark);
            cursor: pointer;
            z-index: 10;
            align-items: center;
            justify-content: center;
            outline: none;
            padding: 0;
            line-height: 1;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background 0.12s ease, 
                        box-shadow 0.12s ease;
        }

        .pad-arrow-prev {
            left: 8px;
        }

        .pad-arrow-next {
            right: 8px;
        }

        .rearrange-mode .pad-arrow {
            display: flex;
            animation: arrow-pop-in 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes arrow-pop-in {
            0% { transform: translateY(-50%) scale(0); opacity: 0; }
            70% { transform: translateY(-50%) scale(1.25); opacity: 1; }
            100% { transform: translateY(-50%) scale(1); opacity: 1; }
        }

        .pad-arrow:hover {
            transform: translateY(-50%) scale(1.18);
            background: var(--cymbal-yellow);
            box-shadow: 0 4px 0 var(--ink-dark);
        }

        .pad-arrow:active {
            transform: translateY(-50%) translateY(2px) scale(0.92);
            box-shadow: 0 1px 0 var(--ink-dark);
            background: #FFE066;
        }

        .rearrange-mode .drum-pad {
            box-shadow: 0 6px 0 var(--ink-dark), 0 0 0 2.5px var(--cymbal-yellow);
        }

        /* Interactive Hotkey Badges in Rearrange Mode */
        .rearrange-mode .pad-number {
            cursor: pointer;
            box-shadow: 0 0 0 2px var(--cymbal-yellow), 1px 1px 0 var(--ink-dark);
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.12s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .rearrange-mode .pad-number:hover {
            transform: scale(1.18);
            background: #FFE066;
        }

        .pad-number.is-rebinding {
            background: var(--coral-accent) !important;
            color: #FFFFFF !important;
            border-color: var(--ink-dark) !important;
            box-shadow: 0 0 0 2.5px var(--cymbal-yellow), 0 2px 0 var(--ink-dark) !important;
            min-width: 22px;
            display: inline-block;
            text-align: center;
            animation: rebind-pulse 0.5s infinite alternate ease-in-out;
        }

        @keyframes rebind-pulse {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.22); }
        }

        /* Pad Repeat Button & States */
        .pad-repeat-btn {
            display: none;
            position: absolute;
            top: 8px;
            left: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--ink-dark);
            z-index: 10;
            align-items: center;
            justify-content: center;
            outline: none;
            padding: 0;
            box-shadow: 0 2px 0 var(--ink-dark);
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.15s ease, box-shadow 0.12s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            pointer-events: none;
            cursor: default;
            touch-action: manipulation;
        }

        .pad-repeat-btn .repeat-icon {
            display: block;
            pointer-events: none;
        }

        /* Repeat Button States (0: Off, 1: Whole, 2: Half, 3: Quarter, 4: 8th, 5: 16th, 6: 32nd) */
        .pad-repeat-btn.repeat-0, .opt-repeat-0 {
            background: #DCE5EB;
            color: #7B8F9C;
        }

        .pad-repeat-btn.repeat-1, .opt-repeat-1 {
            background: #48CAE4; /* Light Blue / Whole Note */
            color: #1F2421;
        }

        .pad-repeat-btn.repeat-2, .opt-repeat-2 {
            background: #57CC99; /* Light Green / Half Note */
            color: #1F2421;
        }

        .pad-repeat-btn.repeat-3, .opt-repeat-3 {
            background: var(--cymbal-yellow); /* Yellow / Quarter Note */
            color: var(--ink-dark);
        }

        .pad-repeat-btn.repeat-4, .opt-repeat-4 {
            background: #FF7B54; /* Orange / 8th Note */
            color: #FFFFFF;
        }

        .pad-repeat-btn.repeat-5, .opt-repeat-5 {
            background: #E63946; /* Red / 16th Note */
            color: #FFFFFF;
        }

        .pad-repeat-btn.repeat-6, .opt-repeat-6 {
            background: #C77DFF; /* Pinkish/Purple / 32nd Note */
            color: #FFFFFF;
        }

        /* When Rearrange is ON: All repeat buttons are visible and interactive */
        .rearrange-mode .pad-repeat-btn {
            display: flex;
            pointer-events: auto;
            cursor: pointer;
        }

        .rearrange-mode .pad-repeat-btn:hover {
            transform: scale(1.18);
            box-shadow: 0 3px 0 var(--ink-dark);
        }

        .rearrange-mode .pad-repeat-btn:active {
            transform: translateY(1px) scale(0.95);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        /* When Rearrange is OFF: Any activated button (1–6) remains visible and interactive for hands-free repeating */
        .pad-repeat-btn.repeat-1,
        .pad-repeat-btn.repeat-2,
        .pad-repeat-btn.repeat-3,
        .pad-repeat-btn.repeat-4,
        .pad-repeat-btn.repeat-5,
        .pad-repeat-btn.repeat-6 {
            display: flex;
            pointer-events: auto;
            cursor: pointer;
        }

        .pad-repeat-btn.repeat-1:hover,
        .pad-repeat-btn.repeat-2:hover,
        .pad-repeat-btn.repeat-3:hover,
        .pad-repeat-btn.repeat-4:hover,
        .pad-repeat-btn.repeat-5:hover,
        .pad-repeat-btn.repeat-6:hover {
            transform: scale(1.18);
            box-shadow: 0 3px 0 var(--ink-dark);
        }

        .pad-repeat-btn.repeat-1:active,
        .pad-repeat-btn.repeat-2:active,
        .pad-repeat-btn.repeat-3:active,
        .pad-repeat-btn.repeat-4:active,
        .pad-repeat-btn.repeat-5:active,
        .pad-repeat-btn.repeat-6:active {
            transform: translateY(1px) scale(0.95);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        /* Active Latched Repeat State (holding core beat continuously) */
        .pad-repeat-btn.is-latched {
            animation: repeatLatchPulse 0.9s ease-in-out infinite alternate;
        }

        @keyframes repeatLatchPulse {
            0% {
                transform: scale(1.06);
                box-shadow: 0 0 0 2px #FFFFFF, 0 0 8px rgba(255, 255, 255, 0.8), 0 2px 0 var(--ink-dark);
            }
            100% {
                transform: scale(1.22);
                box-shadow: 0 0 0 3.5px #FFFFFF, 0 0 16px rgba(255, 255, 255, 1), 0 3px 0 var(--ink-dark);
            }
        }

        /* Repeat Speed Option Popover Window */
        .repeat-popover {
            display: none;
            position: fixed;
            z-index: 2500;
            background: var(--cream-card);
            border: 3.5px solid var(--ink-dark);
            border-radius: 20px;
            padding: 8px 10px;
            box-shadow: 0 6px 0 var(--ink-dark), 0 12px 28px rgba(0,0,0,0.35);
            animation: popover-slide-in 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            touch-action: manipulation;
        }

        .repeat-popover.is-open {
            display: block;
        }

        .repeat-options-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .repeat-option-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--ink-dark);
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 2px 0 var(--ink-dark);
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .repeat-option-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 0 var(--ink-dark);
        }

        .repeat-option-btn:active {
            transform: translateY(2px) scale(0.95);
            box-shadow: 0 1px 0 var(--ink-dark);
        }

        .repeat-option-btn.is-active {
            box-shadow: 0 0 0 2.5px #FFFFFF, 0 0 0 4.5px var(--ink-dark);

    <script>
        let audioContext;
        let analyser;
        let masterGainNode;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                masterGainNode = audioContext.createGain();
                masterGainNode.gain.setValueAtTime(1, audioContext.currentTime);
                analyser.connect(masterGainNode);
                masterGainNode.connect(audioContext.destination);
                
                getNoiseBuffer();
                document.removeEventListener('click', initAudio);
                document.removeEventListener('keydown', initAudio);
                document.removeEventListener('touchstart', initAudio);
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }
        
        document.addEventListener('click', initAudio);
        document.addEventListener('keydown', initAudio);
        document.addEventListener('touchstart', initAudio);
        
        let noiseBuffer = null;
        let shakerStroke = 0;
        let crashPlateEnergy = 0;
        let lastCrashTime = 0;

        function getNoiseBuffer() {
            if (!noiseBuffer && audioContext) {
                const length = audioContext.sampleRate * 2;
                noiseBuffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }
            return noiseBuffer;
        }

        function createNoiseSource() {
            const buffer = getNoiseBuffer();
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            const maxOffset = Math.max(0, buffer.duration - 0.4);
            const startOffset = Math.random() * maxOffset;
            return { source, startOffset };
        }

        const sounds = {
            'bass': function(opts = {}) {
                if (!audioContext) return;
                const t = audioContext.currentTime;
                const is32nd = Boolean(opts && (opts.is32nd || (opts.repeatInterval > 0 && opts.repeatInterval <= 70)));
                const attackScale = is32nd ? 0.25 : 1.0;

                // Bass drum body
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(48, t + 0.045);
                if (is32nd) {
                    gain.gain.setValueAtTime(0.001, t);
                    gain.gain.linearRampToValueAtTime(0.70, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
                } else {
                    gain.gain.setValueAtTime(0.85, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
                }

                // Beater click transient for attack clarity (75% lower attack for 32nd notes)
                const click = audioContext.createOscillator();
                const clickGain = audioContext.createGain();
                click.type = 'sine';
                click.frequency.setValueAtTime(450, t);
                click.frequency.exponentialRampToValueAtTime(60, t + 0.015);
                clickGain.gain.setValueAtTime(0.35 * attackScale, t);
                clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.015);

                osc.connect(gain);
                gain.connect(analyser);
                click.connect(clickGain);
                clickGain.connect(analyser);

                osc.start(t);
                click.start(t);
                osc.stop(t + (is32nd ? 0.07 : 0.4));
                click.stop(t + 0.02);

                return { frequency: 60, volume: is32nd ? 0.75 : 1.0 };
            },
            'snare': function(opts = {}) {
                if (!audioContext) return;
                const t = audioContext.currentTime;
                const is32nd = Boolean(opts && (opts.is32nd || (opts.repeatInterval > 0 && opts.repeatInterval <= 70)));
                const attackScale = is32nd ? 0.25 : 1.0;

                // 1. Drum body / shell tone
                const osc = audioContext.createOscillator();
                const oscGain = audioContext.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.exponentialRampToValueAtTime(125, t + 0.04);
                if (is32nd) {
                    oscGain.gain.setValueAtTime(0.001, t);
                    oscGain.gain.linearRampToValueAtTime(0.45, t + 0.01);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
                } else {
                    oscGain.gain.setValueAtTime(0.65, t);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                }

                // 2. Snare wire sizzle (highpass + bandpass filtered noise)
                const { source: noise, startOffset } = createNoiseSource();
                const hp = audioContext.createBiquadFilter();
                hp.type = 'highpass';
                hp.frequency.setValueAtTime(900, t);

                const bp = audioContext.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.setValueAtTime(3200, t);
                bp.Q.setValueAtTime(1.6, t);

                const noiseGain = audioContext.createGain();
                if (is32nd) {
                    noiseGain.gain.setValueAtTime(0.001, t);
                    noiseGain.gain.linearRampToValueAtTime(0.60, t + 0.01);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);

        function syncActiveRepeatersToBpm() {

                if (latchedRepeats[key] && latchedSchedulers[key] && latchedSchedulers[key].isActive) {

                        clearTimeout(latchedSchedulers[key].timerId);
                        latchedSchedulers[key].timerId = null;

                    const newInterval = getPadRepeatInterval(key);
                    if (newInterval > 0) {
                        const stepInterval = (newInterval === 63 || newInterval === 62.5) ? 62.5 : newInterval;
                        scheduleRepeatVoice(key, now + stepInterval, newInterval, latchedSchedulers[key], false);

                }
            }

        // Master Beat Grid & Musical Quantization Engine

        function markSoundActive(key, options = {}) {

        function getPadQuantizeStep(padIndex) {
            if (padIndex < 0 || padIndex >= padRepeats.length) return quarterNoteMs;
            const state = padRepeats[padIndex];
            if (state === 1) return quarterNoteMs;   // Whole note: quantize to quarter beat (500ms)
            if (state === 2 || state === 3 || state === 4) return eighthNoteMs; // Half, Quarter, 8th: quantize to 8th beat (250ms)
            if (state === 5 || state === 6) return sixteenthNoteMs; // 16th, 32nd: quantize to 16th beat (125ms)
            return quarterNoteMs;

        function getQuantizedLaunchInfo(gridStep, minTime = null) {
            const now = performance.now();

            if (minTime !== null) {
                // For hold repeat: schedules forward after the minimum hold threshold
                if (masterGridOrigin === null) {
                    masterGridOrigin = minTime;
                    return { targetTime: minTime, anchorGridTime: minTime, playImmediate: false };
                }
                const elapsed = minTime - masterGridOrigin;
                const rem = elapsed % gridStep;
                const delayToGrid = rem < 10 ? 0 : (gridStep - rem);
                const targetTime = minTime + delayToGrid;
                return { targetTime, anchorGridTime: targetTime, playImmediate: false };
            }

            if (masterGridOrigin === null) {
                // First repeating voice sets Beat 1.0 of the master beat grid!
                masterGridOrigin = now;
                return { targetTime: now, anchorGridTime: now, playImmediate: true, ratio: 0, quantizedTo: 'origin' };
            }

            // Master grid is already running: align to internal beat structure with 60% late grace / 40% upcoming window
            const elapsed = now - masterGridOrigin;
            if (elapsed <= 0) {
                return { targetTime: masterGridOrigin, anchorGridTime: masterGridOrigin, playImmediate: true, ratio: 0, quantizedTo: 'preceding' };
            }

            const offset = elapsed % gridStep;
            const ratio = offset / gridStep;

            if (ratio <= 0.60) {
                // Up to 60% late: quantize to preceding beat!
                // The strike triggers immediately on down-click, and future steps are anchored to preceding beat
                const precedingGridTime = now - offset;
                return {
                    targetTime: now,
                    anchorGridTime: precedingGridTime,
                    playImmediate: true,
                    ratio,
                    quantizedTo: 'preceding'
                };
            } else {
                // Greater than 60% late (40% window): user is anticipating the upcoming (next) beat
                const delayToNext = gridStep - offset;
                const nextGridTime = now + delayToNext;
                return {
                    targetTime: nextGridTime,
                    anchorGridTime: nextGridTime,
                    playImmediate: false,
                    ratio,
                    quantizedTo: 'next'
                };
            }
        }
        const getQuantizedLaunchTime = getQuantizedLaunchInfo;

        function scheduleRepeatVoice(key, anchorGridTime, repeatInterval, schedulerState, playImmediate = false) {
            const stepInterval = (repeatInterval === 63 || repeatInterval === 62.5) ? 62.5 : repeatInterval;
            let step = 0;

            function tick() {
                if (!schedulerState.isActive) return;

                triggerRepeatStep(key, repeatInterval);

                step++;
                const nextTargetTime = anchorGridTime + (step * stepInterval);
                const nextDelay = Math.max(0, nextTargetTime - performance.now());

                schedulerState.timerId = setTimeout(tick, nextDelay);
            }

            if (playImmediate) {
                if (!schedulerState.isActive) return;
                triggerRepeatStep(key, repeatInterval);

                const now = performance.now();
                step = Math.max(1, Math.ceil((now + 15 - anchorGridTime) / stepInterval));
                const nextTargetTime = anchorGridTime + (step * stepInterval);
                const nextDelay = Math.max(0, nextTargetTime - now);

                schedulerState.timerId = setTimeout(tick, nextDelay);
            } else {
                const initialDelay = Math.max(0, anchorGridTime - performance.now());
                schedulerState.timerId = setTimeout(tick, initialDelay);
            }
        }

        function startLatchedRepeat(key) {

            const launch = getQuantizedLaunchInfo(gridStep);

            latchedSchedulers[key] = { isActive: true, timerId: null };
            scheduleRepeatVoice(key, launch.anchorGridTime, repeatInterval, latchedSchedulers[key], launch.playImmediate);

        function stopLatchedRepeat(key) {

        function getPadRepeatInterval(key) {
            const padIndex = parseInt(key, 10) - 1;
            if (padIndex >= 0 && padIndex < padRepeats.length) {
                const state = padRepeats[padIndex];
                if (state === 1) return wholeNoteMs;        // 2000ms (Whole Note, Light Blue)
                if (state === 2) return halfNoteMs;         // 1000ms (Half Note, Light Green)
                if (state === 3) return quarterNoteMs;      // 500ms (Quarter Note, Yellow)

        function getPadInstrument(key) {

        function triggerPadPress(key, repeatInterval) {
            const instId = getPadInstrument(key);
            let opts = {};
            if (instId === 'guiro') {
                if (repeatInterval <= 125 && repeatInterval > 0) { // 16th and 32nd note repeat: snappy flick
                    opts = { strokeType: 'flick', accentFirst: false };

        function triggerRepeatStep(key, repeatInterval) {
            const instId = getPadInstrument(key);
            let opts = {};
            if (instId === 'guiro') {
                if (repeatInterval >= 500) { // Whole (2000ms), Half (1000ms), Quarter (500ms): long scrape with accent on first
                    opts = { strokeType: 'long', accentFirst: true };
                } else if (repeatInterval === 250) { // 8th note repeat: short scrape (fits in 250ms)
                    opts = { strokeType: 'short', accentFirst: false };
                } else if (repeatInterval <= 125) { // 16th (125ms), 32nd (63ms): snappy flick
                    opts = { strokeType: 'flick', accentFirst: false };

        function getKeyFromEvent(event) {
            const pressedKey = event.key.toLowerCase();
            for (let i = 0; i < currentVoiceCount && i < padHotkeys.length; i++) {

                }, { passive: false });

                repeatBtn.addEventListener('touchend', function(e) {
                    if (isRearranging || padRepeats[padIndex] > 0) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                    }
                });

                repeatBtn.addEventListener('click', function(e) {
                    handleRepeatBtnAction(e);
                });
            }

            if (padNumberBadge) {
                let lastBadgeTime = 0;
                function handleBadgeAction(e) {
                    if (!isRearranging) return;
                    if (e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                    }
                    const now = performance.now();
                    if (now - lastBadgeTime < 350) return;
                    lastBadgeTime = now;
                    startOrToggleRebind(padIndex);
                }

                padNumberBadge.addEventListener('mousedown', function(e) {
                    if (isRearranging) e.stopPropagation();
                });

                padNumberBadge.addEventListener('touchstart', function(e) {
                    if (isRearranging) {
                        handleBadgeAction(e);
                    }
                }, { passive: false });

                padNumberBadge.addEventListener('touchend', function(e) {
                    if (isRearranging) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                    }
                });

                padNumberBadge.addEventListener('click', function(e) {
                    if (isRearranging) {
                        handleBadgeAction(e);
                    }
                });
            }

            if (prevArrow) {
                let lastPrevTime = 0;
                function handlePrevArrow(e) {
                    if (e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                    }
                    const now = performance.now();
                    if (now - lastPrevTime < 300) return;
                    lastPrevTime = now;
                    changePadInstrument(padIndex, -1);
                }

                prevArrow.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                prevArrow.addEventListener('touchstart', handlePrevArrow, { passive: false });
                prevArrow.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    if (e.cancelable) e.preventDefault();
                });
                prevArrow.addEventListener('click', handlePrevArrow);
            }

            if (nextArrow) {
                let lastNextTime = 0;
                function handleNextArrow(e) {
                    if (e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                    }
                    const now = performance.now();
                    if (now - lastNextTime < 300) return;
                    lastNextTime = now;
                    changePadInstrument(padIndex, 1);
                }

                nextArrow.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                nextArrow.addEventListener('touchstart', handleNextArrow, { passive: false });
                nextArrow.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    if (e.cancelable) e.preventDefault();
                });
                nextArrow.addEventListener('click', handleNextArrow);
            }

            function createRipple(event, button) {
                const rect = button.getBoundingClientRect(); 
                const x = event.clientX - rect.left; 
                const y = event.clientY - rect.top;
                const ripple = document.createElement('span'); 
                ripple.className = 'ripple'; 
                ripple.style.left = `${x}px`; 
                ripple.style.top = `${y}px`;
                button.appendChild(ripple); 
                setTimeout(() => { ripple.remove(); }, 600);
            }

            pad.addEventListener('mousedown', function(e) {
                if (e.target.closest('.pad-arrow, .pad-repeat-btn, .pad-number')) return;
                createRipple(e, this);
                // If this note is actively holding a latched repeat, pressing it deactivates it
                if (latchedRepeats[key]) {
                    stopLatchedRepeat(key);
                    return;
                }
                if (!isPressing) {
                    isPressing = true; 
                    const repeatInterval = getPadRepeatInterval(key);
                    const soundInfo = triggerPadPress(key, repeatInterval);
                    animatePad(key, soundInfo);
                    if (repeatInterval > 0) {
                        startHoldRepeat(key);
                    }
                }
            });

            pad.addEventListener('mouseup', function(e) { 
                isPressing = false; 
                cancelPadPress(key);
            });

            pad.addEventListener('mouseleave', function(e) { 
                if (isPressing) { 
                    isPressing = false; 
                    cancelPadPress(key);
                } 
            });

            pad.addEventListener('touchstart', function(e) { 
                if (e.target.closest('.pad-arrow, .pad-repeat-btn, .pad-number')) return;
                e.preventDefault(); 
                const touch = e.touches[0]; 
                createRipple({clientX: touch.clientX, clientY: touch.clientY}, this);
                // If this note is actively holding a latched repeat, pressing it deactivates it
                if (latchedRepeats[key]) {
                    stopLatchedRepeat(key);
                    return;
                }
                if (!isPressing) { 
                    isPressing = true; 
                    const repeatInterval = getPadRepeatInterval(key);
                    const soundInfo = triggerPadPress(key, repeatInterval);
                    animatePad(key, soundInfo); 
                    if (repeatInterval > 0) {
                        startHoldRepeat(key);
                    }
                } 
            });

            pad.addEventListener('touchend', function(e) { 
                if (e.target.closest('.pad-arrow, .pad-repeat-btn, .pad-number')) return;
                e.preventDefault(); 
                isPressing = false; 
                cancelPadPress(key);
            });

            pad.addEventListener('touchcancel', function(e) { 
                if (e.target.closest('.pad-arrow, .pad-repeat-btn, .pad-number')) return;
                isPressing = false; 
                cancelPadPress(key);
            });

            pad.addEventListener('touchmove', function(e) { 
                e.preventDefault(); 
            }, { passive: false });

            // Keyboard accessibility for focused drum pads
            pad.addEventListener('keydown', function(e) {
                if ((e.key === 'Enter' || e.key === ' ') && !heldKeys[key]) {
                    e.preventDefault();
                    heldKeys[key] = true;
                    const repeatInterval = getPadRepeatInterval(key);
                    const soundInfo = triggerPadPress(key, repeatInterval);
                    animatePad(key, soundInfo);
                    if (repeatInterval > 0) {
                        startHoldRepeat(key);
                    }
                }
            });
            pad.addEventListener('keyup', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    heldKeys[key] = false;
                    cancelPadPress(key);
                }
            });
        });

        const rackFrame = document.querySelector('.rack-frame');
        if (rackFrame) {
            rackFrame.addEventListener('touchmove', function(e) { 
                e.preventDefault(); 
            }, { passive: false });
        }

        function playSound(key, options = {}) { 
            initAudio();
            markSoundActive(key, options);
            const padIndex = parseInt(key, 10) - 1;
            if (padIndex >= 0 && padIndex < padLayout.length) {
                const instId = padLayout[padIndex];
                if (sounds[instId]) {
                    return sounds[instId](options);
                }
            } else if (sounds[key]) { 
                return sounds[key](options); 
            } 
            return null; 
        }

        initAllPads();
        updateAllPadNumberBadges();
        updateAllPadRepeatButtons();
        setVoiceCount(currentVoiceCount);
        updatePlayStopButton();
        
        function animatePad(key, soundInfo = null) {
            const pad = document.querySelector(`.drum-pad[data-key="${key}"]`);
            if (!pad) return;
            pad.classList.remove('active'); 
            setTimeout(() => { pad.classList.add('active'); }, 10);
            createParticles(pad, key);
            if (soundInfo) { boostVisualizer(soundInfo); }
        }
        
        function boostVisualizer(soundInfo) {
            const led = document.querySelector('.status-led');
            if (led) {
                led.classList.remove('pulse');
                void led.offsetWidth;
                led.classList.add('pulse');
            }
        }
        
        function createParticles(pad, key) {
            if (!pad) return;
            const padCenterX = pad.clientWidth / 2;
            const padCenterY = pad.clientHeight / 2 - 10;
            
            const colors = ['#F5C542', '#FF7B54', '#7B8F9C', '#4EA8DE', '#52B788', '#FDF6E7'];
            const count = 5 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const x = padCenterX + (Math.random() - 0.5) * 36;
                const y = padCenterY + (Math.random() - 0.5) * 24;
                particle.style.left = `${x}px`; 
                particle.style.top = `${y}px`;
                const size = 6 + Math.random() * 5;
                particle.style.width = `${size}px`; 
                particle.style.height = `${size}px`;
                
                const dx = (Math.random() - 0.5) * 44;
                const dy = -(20 + Math.random() * 35);
                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = color;
                const duration = 0.55 + Math.random() * 0.35; 
                const delay = Math.random() * 0.1;
                particle.style.animation = `cartoon-particle ${duration}s cubic-bezier(0.2, 0.8, 0.4, 1) ${delay}s forwards`;
                pad.appendChild(particle);
                setTimeout(() => { particle.remove(); }, (duration + delay + 0.1) * 1000);
            }
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                Object.keys(repeatTimers).forEach(key => { 
                    if (repeatTimers[key]) { 
                        clearTimeout(repeatTimers[key]); 
                        clearInterval(repeatTimers[key]); 
                        repeatTimers[key] = null; 
                    } 
                });
                Object.keys(heldKeys).forEach(key => { heldKeys[key] = false; });
                document.querySelectorAll('.drum-pad.active').forEach(pad => { 
                    pad.classList.remove('active'); 
                });
            }
        });
        
        let wakeLock = null;
        async function requestWakeLock() {
            try { 
                if ('wakeLock' in navigator) { 
                    wakeLock = await navigator.wakeLock.request('screen'); 
                } 
            }
            catch (err) { 
                console.log("Wake Lock error:", err); 
            }
        }
        document.addEventListener('click', requestWakeLock, { once: true });
        document.addEventListener('touchstart', requestWakeLock, { once: true });
        document.addEventListener('visibilitychange', async () => { 
            if (wakeLock !== null && document.visibilityState === 'visible') { 
                await requestWakeLock(); 
            } 
        });
    </script>
</body>
</html>
