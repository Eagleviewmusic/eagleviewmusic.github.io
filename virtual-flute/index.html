<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Flute</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: white;
      width: 100vw;
      min-height: 100vh;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .app-center-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      min-width: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .scaling-outer {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    /* Three rows: the staff beside the printed chart's symbol, the flute, the notes. updateScale sets the gap between them. */
    .scaling-wrapper {
      width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .top-row {
      width: 1100px;
      display: flex;
      align-items: flex-start;
    }
    #staff {
      width: 260px;
      height: 170px;
      display: block;
      margin-left: 244px;
    }
    /* The chart is sized and placed by the staff: the tops of its five big circles (chart y 112) on the staff's top line,
       the bottoms of the B♭ lever and trill keys (chart y 244) on its bottom line. Those 132 chart units = the 48 px
       between the lines, so scale 4/11. */
    #chart {
      width: 328px;
      height: 101.09px;
      display: block;
      margin-left: 23px;
      margin-top: 56.36px;
    }
    #flute {
      width: 1100px;
      height: 140px;
      display: block;
    }

    /* The notes, laid out like a piano: low B at the left, sharps and flats on top between the letters */
    .note-pad {
      position: relative;
      width: 1058px;
      height: 94px;
      margin-top: 4px;
    }
    .note-btn {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.28);
      border-radius: 7px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    .note-btn.natural {
      top: 30px;
      width: 44px;
      height: 64px;
      font-size: 19px;
      justify-content: flex-end;
      padding-bottom: 5px;
    }
    .note-btn.sharp {
      top: 0;
      width: 36px;
      height: 44px;
      z-index: 1;
    }
    .note-btn .names {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .note-btn.sharp .names b { font-size: 13px; }
    .note-btn.sharp .names small { font-size: 9.5px; opacity: 0.8; margin-top: 1px; }
    .note-btn .acc { margin-left: -0.1em; }
    .note-btn .key {
      font: 10.5px monospace;
      opacity: 0.6;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .note-btn.natural .key { margin-top: 2px; }
    .note-btn.selected {
      outline: 3px solid #1f2937;
      outline-offset: 1px;
      z-index: 2;
    }
    .note-btn.active {
      transform: scale(1.08);
      filter: brightness(1.12);
      z-index: 3;
    }
    .note-btn:focus { outline: none; }
    .note-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 1px; }
    .note-btn.selected:focus-visible { outline-color: #1f2937; }
    @media (hover: none) and (pointer: coarse) {
      .note-btn .key { display: none; }
    }

    /* First notes: eleven big buttons in one row */
    .note-pad.first {
      width: 1012px;
      height: 70px;
    }
    .note-btn.scale-note {
      top: 0;
      width: 86px;
      height: 70px;
      font-size: 24px;
      justify-content: center;
      padding-bottom: 0;
    }
    .note-btn.scale-note .names b { font-size: 22px; }
    .note-btn.scale-note .names small { font-size: 12px; }

    .tip-area {
      width: 1000px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.3;
      color: #374151;
    }
    .tip-area .hint { color: #9ca3af; }
    .alt-btn {
      font: 700 12px/1 sans-serif;
      padding: 6px 11px;
      border-radius: 9999px;
      border: 1.5px solid #3b6ea8;
      background: #eaf2fb;
      color: #1f4d80;
      cursor: pointer;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .alt-btn:hover { background: #d7e6f7; }

    /* ----- settings ----- */
    #app-header { box-sizing: border-box; }
    .gear-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(30, 41, 59, 0.88);
      color: #f1f5f9;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .gear-btn:hover, .gear-btn[aria-expanded="true"] { background: #334155; color: #74B9FF; }
    /* Cycles what the flute's keys say: Keys (nothing), Fingers, Names */
    .labels-btn {
      position: absolute;
      top: 50%;
      right: 52px;
      transform: translateY(-50%);
      min-width: 76px;
      height: 34px;
      padding: 0 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(30, 41, 59, 0.88);
      color: #f1f5f9;
      font: 600 13px/1 Montserrat, system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .labels-btn:hover { background: #334155; color: #74B9FF; }
    @media (max-width: 360px) { .labels-btn { min-width: 62px; padding: 0 8px; right: 48px; } }
    .gear-btn svg { width: 19px; height: 19px; }

    .settings-panel {
      position: fixed;
      top: 44px;
      right: 0;
      bottom: 0;
      width: min(360px, 100vw);
      z-index: 9998;
      box-sizing: border-box;
      padding: 12px 16px 28px;
      overflow-y: auto;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      box-shadow: -6px 0 24px rgba(0, 0, 0, 0.15);
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
      color: #1f2937;
      visibility: hidden;
      transform: translateX(105%);
      transition: transform 0.2s ease, visibility 0s 0.2s;
    }
    .settings-panel.open {
      visibility: visible;
      transform: none;
      transition: transform 0.2s ease;
    }
    .sp-head { display: flex; align-items: center; justify-content: space-between; }
    .sp-head h2 { margin: 0; font: normal 24px 'Lobster', cursive; color: #3b6ea8; }
    .sp-close { border: 0; background: none; padding: 2px 6px; font-size: 28px; line-height: 1; color: #6b7280; cursor: pointer; }
    .sp-section { margin-top: 16px; }
    .sp-section h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
    }
    .sp-group {
      margin: 18px 0 4px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
      font-weight: 800;
      font-size: 13px;
      color: #1f4d80;
    }
    .view-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .view-choice button {
      padding: 10px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: #ffffff;
      font: inherit;
      text-align: left;
      color: inherit;
      cursor: pointer;
    }
    .view-choice button b { display: block; font-size: 15px; }
    .view-choice button small { display: block; margin-top: 2px; font-size: 12px; color: #6b7280; }
    .view-choice button[aria-checked="true"] { border-color: #3b6ea8; background: #eaf2fb; }
    .sp-row { margin: 12px 0; }
    .sp-row.off { opacity: 0.45; }
    .sp-label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 13.5px; }
    .sp-value { font-weight: 600; color: #1f4d80; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sp-row input[type="range"] { width: 100%; margin: 6px 0 1px; accent-color: #3b6ea8; }
    .sp-ends { display: flex; justify-content: space-between; font-size: 11px; color: #9ca3af; }
    .sp-hint { margin-top: 3px; font-size: 11.5px; color: #6b7280; }
    .seg { display: flex; margin-top: 6px; border: 1.5px solid #d1d5db; border-radius: 9px; overflow: hidden; }
    .seg button {
      flex: 1;
      padding: 7px 4px;
      border: 0;
      border-left: 1px solid #e5e7eb;
      background: #ffffff;
      font: 600 13px system-ui, -apple-system, sans-serif;
      color: #374151;
      cursor: pointer;
    }
    .seg button:first-child { border-left: 0; }
    .seg button[aria-checked="true"] { background: #3b6ea8; color: #ffffff; }
    .sp-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .sp-btn {
      padding: 7px 13px;
      border-radius: 9999px;
      border: 1.5px solid #3b6ea8;
      background: #eaf2fb;
      font: 700 13px system-ui, -apple-system, sans-serif;
      color: #1f4d80;
      cursor: pointer;
    }
    .sp-btn:hover { background: #d7e6f7; }
    .sp-btn.primary { background: #3b6ea8; color: #ffffff; }
    .sp-btn.primary:hover { background: #2f5c8f; }
  </style>

  <!-- EVM visit counter: one anonymous count each time an app is opened. What is sent, and what never is: /what-we-count.html -->
  <script>
    (function () {
      var off = false;
      try { off = localStorage.getItem('skipgc') === 't'; } catch (e) {}
      if (location.hash === '#toggle-goatcounter') {   // the teacher's own browsers opt out here (and back in)
        try { off ? localStorage.removeItem('skipgc') : localStorage.setItem('skipgc', 't'); } catch (e) {}
        alert(off ? 'Visits from this browser will be counted again.' : 'Visits from this browser will no longer be counted.');
        return;
      }
      if (off || navigator.webdriver) return;
      if (navigator.globalPrivacyControl || navigator.doNotTrack === '1' || window.doNotTrack === '1') return;   // the visitor asked not to be counted
      if (!/(^|\.)eagleviewmusic\.com$/.test(location.hostname)) return;   // testing, or a copy on another site
      try { if (window.top !== window && parent.location.host) return; } catch (e) {}   // framed by another of our apps (the Music Stand), which counts itself
      try {
        var p = decodeURIComponent(location.pathname).replace(/index\.html$/, '');
        var r = document.referrer.split(/[?#]/)[0];   // where the visit came from, never the rest of a link
        var u = 'https://eagleviewmusic.goatcounter.com/count?p=' + encodeURIComponent(p) +
          (r ? '&r=' + encodeURIComponent(r) : '') + '&s=' + screen.width + '&rnd=' + Math.random().toString(36).slice(2, 7);
        if (!(navigator.sendBeacon && navigator.sendBeacon(u))) new Image().src = u;
      } catch (e) {}
    })();
  </script>

  <script>
    // Fingerings for the Boehm flute (closed G♯, B foot) from the Woodwind Fingering Guide's basic
    // chart, low B to top C. Each one reads: thumb, left-hand fingers, right-hand fingers, then any
    // other keys:
    //   T   thumb on the B key        Tb  thumb on the B♭ key        -   thumb off
    //   123 fingers 1 2 3 of that hand down, - up
    //   G#  G♯ lever (left little finger)        Eb  E♭ key (right little finger)
    //   C# C B  the low C♯, C and B keys (right little finger)        giz  the gizmo (B foot)
    //   D D#  the two trill keys (right hand)        BbL  the B♭ lever beside the right index finger
    // A second fingering is one of the guide's alternates.
    const CHART = [
      ['B3',  'T 123 123 B'],
      ['C4',  'T 123 123 C'],
      ['C#4', 'T 123 123 C#'],
      ['D4',  'T 123 123'],
      ['D#4', 'T 123 123 Eb'],
      ['E4',  'T 123 12- Eb'],
      ['F4',  'T 123 1-- Eb'],
      ['F#4', 'T 123 --3 Eb'],
      ['G4',  'T 123 --- Eb'],
      ['G#4', 'T 123 --- G# Eb'],
      ['A4',  'T 12- --- Eb'],
      ['A#4', 'T 1-- 1-- Eb', 'Tb 1-- --- Eb', 'T 1-- --- BbL Eb'],
      ['B4',  'T 1-- --- Eb'],
      ['C5',  '- 1-- --- Eb'],
      ['C#5', '- --- --- Eb'],
      ['D5',  'T -23 123'],
      ['D#5', 'T -23 123 Eb'],
      ['E5',  'T 123 12- Eb'],
      ['F5',  'T 123 1-- Eb'],
      ['F#5', 'T 123 --3 Eb'],
      ['G5',  'T 123 --- Eb'],
      ['G#5', 'T 123 --- G# Eb'],
      ['A5',  'T 12- --- Eb'],
      ['A#5', 'T 1-- 1-- Eb', 'Tb 1-- --- Eb', 'T 1-- --- BbL Eb'],
      ['B5',  'T 1-- --- Eb'],
      ['C6',  '- 1-- --- Eb'],
      ['C#6', '- --- --- Eb'],
      ['D6',  'T -23 --- Eb'],
      ['D#6', 'T 123 123 G# Eb'],
      ['E6',  'T 12- 12- Eb'],
      ['F6',  'T 1-3 1-- Eb'],
      ['F#6', 'T 1-3 --3 Eb'],
      ['G6',  '- 123 --- Eb'],
      ['G#6', '- -23 --- G# Eb'],
      ['A6',  'T -2- 1-- Eb'],
      ['A#6', 'T --- 1-- D'],
      ['B6',  'T 1-3 --- D#'],
      ['C7',  '- 123 1-- G# giz'],
    ];

    // Computer keys (by position, so they work on any keyboard layout): the bottom row plays the
    // first octave, the top row the second, and Shift moves either row up an octave.
    const KEY_CODES = {
      KeyA: 'B3',
      KeyZ: 'C4', KeyS: 'C#4', KeyX: 'D4', KeyD: 'D#4', KeyC: 'E4', KeyV: 'F4', KeyG: 'F#4',
      KeyB: 'G4', KeyH: 'G#4', KeyN: 'A4', KeyJ: 'A#4', KeyM: 'B4',
      KeyQ: 'C5', Digit2: 'C#5', KeyW: 'D5', Digit3: 'D#5', KeyE: 'E5', KeyR: 'F5', Digit5: 'F#5',
      KeyT: 'G5', Digit6: 'G#5', KeyY: 'A5', Digit7: 'A#5', KeyU: 'B5',
      KeyI: 'C6', Digit9: 'C#6', KeyO: 'D6', Digit0: 'D#6', KeyP: 'E6', BracketLeft: 'F6', Equal: 'F#6', BracketRight: 'G6',
      Comma: 'C5', KeyL: 'C#5', Period: 'D5', Semicolon: 'D#5', Slash: 'E5',   // the bottom row carries on too
    };
    const KEY_LABELS = {
      KeyA: 'a', KeyZ: 'z', KeyS: 's', KeyX: 'x', KeyD: 'd', KeyC: 'c', KeyV: 'v', KeyG: 'g', KeyB: 'b', KeyH: 'h',
      KeyN: 'n', KeyJ: 'j', KeyM: 'm', Comma: ',', KeyL: 'l', Period: '.', Semicolon: ';', Slash: '/',
      KeyQ: 'q', Digit2: '2', KeyW: 'w', Digit3: '3', KeyE: 'e', KeyR: 'r', Digit5: '5', KeyT: 't', Digit6: '6',
      KeyY: 'y', Digit7: '7', KeyU: 'u', KeyI: 'i', Digit9: '9', KeyO: 'o', Digit0: '0', KeyP: 'p',
      BracketLeft: '[', Equal: '=', BracketRight: ']',
    };

    const LETTER_COLORS = {
      C: '#FF3B30', D: '#FF8A00', E: '#FFF200', F: '#34C759',
      G: '#30C0C6', A: '#007AFF', B: '#AF52DE'
    };
    const LETTERS = 'CDEFGAB';
    // Sharps and flats: the name most band music uses first, then the other name
    const ACCIDENTAL_NAMES = {
      C: ['C♯', 'D♭'], D: ['E♭', 'D♯'], F: ['F♯', 'G♭'], G: ['A♭', 'G♯'], A: ['B♭', 'A♯']
    };

    const notes = CHART.map(([pitch, ...fingerings]) => {
      const letter = pitch[0];
      const sharp = pitch[1] === '#';
      const octave = Number(pitch.slice(-1));
      const upper = LETTERS[(LETTERS.indexOf(letter) + 1) % 7];
      const name = sharp ? ACCIDENTAL_NAMES[letter][0] : letter;
      return {
        pitch, fingerings: fingerings.map(parseFingering), sharp, octave,
        name, otherName: sharp ? ACCIDENTAL_NAMES[letter][1] : '',
        // Where it sits on the staff: the letter of its first name (E♭ on E's line), in steps from C4
        step: (octave - 4) * 7 + LETTERS.indexOf(name[0]),
        accidental: name[1] || '',
        // A sharp's colour runs from the letter below it to the letter above it
        color: LETTER_COLORS[letter],
        upperColor: sharp ? LETTER_COLORS[upper] : LETTER_COLORS[letter],
      };
    });
    const notesByPitch = Object.fromEntries(notes.map(n => [n.pitch, n]));

    // The first-notes view: the B♭ scale and the notes just under it, on the number keys
    const FIRST = ['F4', 'G4', 'A4', 'A#4', 'C5', 'D5', 'D#5', 'F5', 'G5', 'A5', 'A#5'];
    const FIRST_CODES = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus'];
    const FIRST_LABELS = '1234567890-';

    function parseFingering(code) {
      const [thumb, left, right, ...extra] = code.split(/\s+/);
      const keys = new Set();
      if (thumb === 'T') keys.add('T');
      if (thumb === 'Tb') keys.add('Tb');
      [...left].forEach(c => { if (c !== '-') keys.add('L' + c); });
      [...right].forEach(c => { if (c !== '-') keys.add('R' + c); });
      extra.forEach(k => keys.add({ 'G#': 'Gs', 'C#': 'Cs', 'D#': 'trDs', 'D': 'trD' }[k] || k));
      return keys;
    }

    // ----- saved settings (this browser only) -----
    const STORE_KEY = 'virtual-flute-settings';
    function loadSettings() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
    }
    function saveSettings() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, view, labels: labelView, sound: soundSettings })); } catch (e) { /* private window */ }
    }
    const saved = loadSettings();
    let view = saved.view === 'first' ? 'first' : 'chromatic';
    let labelView = ['fingers', 'names'].includes(saved.labels) ? saved.labels : 'keys';   // what the flute's keys say
    let keyMap = {};   // e.code -> pitch, for the view on screen

    // Which fingering each note shows, when it has more than one (kept while the page is open)
    const chosenFingering = {};
    let shownNote = null;

    // ----- colours -----
    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgbToHex(rgb) {
      return '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }
    function mix(a, b, t) {
      const ra = hexToRgb(a), rb = hexToRgb(b);
      return rgbToHex(ra.map((v, i) => v + (rb[i] - v) * t));
    }
    function darken(hex, amount) {
      return rgbToHex(hexToRgb(hex).map(v => v * (1 - amount)));
    }
    function luminance(hex) {
      const [r, g, b] = hexToRgb(hex).map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function textColorOn(hex) {
      return luminance(hex) > 0.3 ? '#1f2937' : '#ffffff';
    }
    function noteMid(note) {
      return note.sharp ? mix(note.color, note.upperColor, 0.5) : note.color;
    }

    // ----- the note buttons -----
    const notePad = document.getElementById('notePad');

    // Pulls ♯ / ♭ in against the letter (their fallback font leaves a gap)
    function accidentalHtml(name) {
      return `${name[0]}<span class="acc">${name[1]}</span>`;
    }
    const COL = 46;   // one letter's width, gap included

    function addNoteButton(note, label, kind, left) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'note-btn ' + kind;
      btn.dataset.pitch = note.pitch;
      btn.style.left = left + 'px';
      btn.setAttribute('aria-label', note.sharp
        ? `${note.name} / ${note.otherName} (${note.pitch.replace('#', '♯')})`
        : note.pitch);
      btn.title = label ? `Press ${label.toUpperCase()} to play ${note.sharp ? note.name + ' / ' + note.otherName : note.name}` : note.name;
      if (note.sharp) {
        btn.style.background = `linear-gradient(to right, ${note.color}, ${note.upperColor})`;
        btn.style.color = textColorOn(noteMid(note));
      } else {
        btn.style.background = note.color;
        btn.style.color = textColorOn(note.color);
      }
      const names = note.sharp
        ? `<b>${accidentalHtml(note.name)}</b><small>${accidentalHtml(note.otherName)}</small>`
        : note.name;
      btn.innerHTML = `<span class="names">${names}</span>` + (label ? `<span class="key">${label}</span>` : '');

      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        press(note);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(type =>
        btn.addEventListener(type, () => release(note)));
      // Enter or Space on a focused button plays a short note
      btn.addEventListener('click', e => {
        if (e.detail !== 0) return;
        press(note);
        setTimeout(() => release(note), 400);
      });
      btn.addEventListener('contextmenu', e => e.preventDefault());
      notePad.appendChild(btn);
    }

    // The label shown on a note's button: its first key, or ⇧ plus the key an octave below
    function chromaticLabel(pitch) {
      const code = Object.keys(KEY_CODES).find(c => KEY_CODES[c] === pitch);
      if (code) return KEY_LABELS[code];
      const below = pitch.slice(0, -1) + (Number(pitch.slice(-1)) - 1);
      const lower = Object.keys(KEY_CODES).find(c => KEY_CODES[c] === below);
      return lower ? '⇧' + KEY_LABELS[lower] : '';
    }

    function buildNotePad() {
      notePad.innerHTML = '';
      notePad.className = 'note-pad ' + view;
      keyMap = {};
      if (view === 'first') {
        FIRST.forEach((pitch, i) => {
          addNoteButton(notesByPitch[pitch], FIRST_LABELS[i], 'scale-note', i * 92);
          keyMap[FIRST_CODES[i]] = pitch;
        });
      } else {
        let naturalIndex = -1;
        notes.forEach(note => {
          if (note.sharp) {
            // Sits over the line between the letter below and the letter above
            addNoteButton(note, chromaticLabel(note.pitch), 'sharp', (naturalIndex + 1) * COL - 18 - 1);
          } else {
            naturalIndex++;
            addNoteButton(note, chromaticLabel(note.pitch), 'natural', naturalIndex * COL);
          }
        });
        Object.assign(keyMap, KEY_CODES);
      }
    }

    // ----- drawing the flute -----
    // A Boehm flute with a closed G♯, an offset G and a B foot, seen the way the fingering charts show it:
    // head joint at the left, foot at the right, the key cups along the tube, the levers the little
    // finger works above it and the right little finger's below it, the thumb keys (really on the back), the
    // B♭ lever and the trill keys below it, where the charts put them. Everything else is placed from real measurements: millimetres
    // from the centre of the embouchure hole (the crown is 72 mm above it) and a 20 mm tube. The row on the body is measured off Yamaha's
    // labelled parts diagram and a photograph laid over the drawing, with Nelson's patent US4819538 for the spacing around the left index finger
    // (the plate 41 mm from the left middle finger's cup, the cup between them 22 mm).
    const MM = 1.5;                                   // px per mm
    const px = d => Math.round((80 + MM * d) * 2) / 2; // d = mm from the embouchure hole
    const AXIS = 118;              // the tube's centre line
    const TUBE = 15;               // half its width (20 mm)
    const CUP = 14;                // a cup's radius (18 mm)
    const ROD = AXIS - 6;          // the foot's rod, across the upper half of the tube
    const ROD_BODY = AXIS + TUBE + 8;   // the body's rod, below the tube (on a real flute they swap sides at the joint)
    const OFFSET_G = -6.5;         // the two G cups stand out of the row, toward the left hand's fingers
    const ROD_G = AXIS + TUBE - 4; // and turn on a short rod of their own
    const FOOT_DROP = 14;
    const CROWN_X = px(-72);       // the end of the flute
    const HEAD_TUBE_X = CROWN_X + 7;   // where the head joint's tube comes out of the crown's ring
    const EDGE = '#555b62';

    // Tone holes along the tube, named the way flute makers name them: by the note that sounds when
    // the hole is the highest one open. A finger's own cup sits on one hole; links close others.
    // finger and name are what a cup says on the flute: who plays it, and what flutists call it, which is
    // the note it makes as the last key down (the L3 cup is the G key though it sits on the A hole).
    // Left 1 does not press a cup at all: it rests on a plate with no hole under it, and that plate closes the
    // little C♯ cup farther up the tube.
    //   open at rest, on the front
    const OPEN_CUPS = {
      Cs:  { mm: 227, r: 10, name: 'B' },     // C♯ hole: the small cup at the top of the row, closed from the left 1 plate
      L1:  { mm: 261, r: 12, plate: true, finger: 'L1', name: 'B' },   // the plate itself
      Bb:  { mm: 282, name: 'B♭' },      // B hole: the B♭ cup (left 2, right 1, thumb B♭ or the B♭ lever)
      As:  { mm: 305, finger: 'L2', name: 'A' },    // A♯ hole: left 2
      A:   { mm: 329, dy: OFFSET_G, finger: 'L3', name: 'G' },   // A hole: left 3
      Gf:  { mm: 353.5, dy: OFFSET_G, name: 'G♯' },   // the second G♯ hole: left 3 closes this cup too (the "lower G")
      G:   { mm: 378, name: 'F♯' },    // G hole: any right-hand finger (the F♯ mechanism)
      Fs:  { mm: 406, finger: 'R1', name: 'F' },  // F♯ hole: right 1
      F:   { mm: 436, finger: 'R2', name: 'E' },    // F hole: right 2
      E:   { mm: 467, finger: 'R3', name: 'D' },    // E hole: right 3
      // The foot joint is turned on the body, so in this view its cups hang off the tube's lower edge
      D:   { mm: 534, dy: FOOT_DROP, nameDy: 3.5, name: 'C♯' },     // D hole, on the foot: the C♯ key
      CsF: { mm: 570, dy: FOOT_DROP, nameDy: 3.5, name: 'C' },      // C♯ hole: the C roller
      CF:  { mm: 608.5, dy: FOOT_DROP, nameDy: 3.5, name: 'B' },    // C hole: the B roller, or the gizmo
    };
    //   closed at rest, the E♭ key opens it: the D♯ hole, first on the foot and on the far side
    // Seen nearly edge-on along the top of the tube.
    const DS_CUP = { mm: 498, rx: 14.5, ry: 8, y: AXIS - TUBE - 1 };
    // The holes on the back of the tube, head to foot: D♯ trill, D trill, and the first G♯ hole (the one the
    // G♯ lever opens), behind the second. From the front only their edges show, below the tube. The trill
    // holes are the highest on the flute, above the C♯ cup. The thumb's C hole is back here too, behind the
    // left 1 plate.
    const REAR_CUPS = [{ mm: 193, r: 7.5 }, { mm: 211, r: 7.5 }, { mm: 353.5, r: 11.5 }];
    const THUMB_MM = 265;

    // The right little finger's cluster on the foot (littleFingerKeys below), in px, measured off a photograph of a
    // B foot and the Flute World gizmo diagram, both seen from this side:
    //   the E♭ touch comes first, right beside the socket, hanging below the rod;
    //   the rollers lie ALONG the tube, the B roller next to the rod, the C roller beyond it;
    //   the C♯ touch lies below them: flat against the rollers, a hump, then a tail that sweeps up to a strap;
    //   the gizmo caps the rollers' far ends: a strap off its own rod that flares into a comma-shaped pad.
    //     Its rod runs along the top of the tube and steps down at a collar onto the last cup's piece of the
    //     main rod, and only that cup, so the whole piece takes the note's colour when it is pressed.
    // The rollers and the pad are drawn about 1.3 times true size, so they can be told apart and labelled.
    const LF = {
      rollerL: 817.5, rollerR: 841, // a roller's barrel
      B: 121, C: 130.5, R: 4.7,     // the rollers' centre lines and radius
      lugL: 815.8, lugR: 845,       // the little arms that hold the rollers' axles
      csStrap: 859.8,               // the strap from the C♯ touch up to the rod
      rod2: 105,                    // the gizmo's own rod
      collar: 960, rodEnd: 1010,    // where that rod steps down, and where the main rod ends
    };

    // What a fingering does to the cups, the way the mechanism links them
    function cupStates(keys) {
      const closed = new Set();
      const has = k => keys.has(k);
      if (has('L1')) { closed.add('L1'); closed.add('Cs'); }
      if (has('L2')) { closed.add('As'); closed.add('Bb'); }
      if (has('L3')) { closed.add('A'); closed.add('Gf'); }
      if (has('R1')) { closed.add('Fs'); closed.add('G'); closed.add('Bb'); }   // "1 and 1" B♭
      if (has('R2')) { closed.add('F'); closed.add('G'); }
      if (has('R3')) { closed.add('E'); closed.add('G'); }
      if (has('Tb') || has('BbL')) closed.add('Bb');
      if (has('Cs')) closed.add('D');
      if (has('C')) { closed.add('D'); closed.add('CsF'); }
      if (has('B')) { closed.add('D'); closed.add('CsF'); closed.add('CF'); }
      if (has('giz')) closed.add('CF');
      return { closed, eFlatOpen: has('Eb'), thumb: has('T') || has('Tb') };
    }

    function tubeRect(x1, x2, r, fill, rx) {
      return `<rect fill="${fill}" x="${x1}" y="${AXIS - r}" width="${x2 - x1}" height="${2 * r}" rx="${rx || 0}" />`;
    }

    // The crown: a low dome on a ridged ring that closes the end of the tube
    function crownMarkup() {
      const x = CROWN_X;
      return `<path fill="url(#ring)" d="M${x + 5},${AXIS - 13} C${x + 1.6},${AXIS - 10.5} ${x},${AXIS - 5} ${x},${AXIS} C${x},${AXIS + 5} ${x + 1.6},${AXIS + 10.5} ${x + 5},${AXIS + 13} Z" />
        <rect fill="url(#ring)" x="${x + 3.5}" y="${AXIS - 15.6}" width="7" height="31.2" rx="2" />
        <line x1="${x + 7}" y1="${AXIS - 15}" x2="${x + 7}" y2="${AXIS + 15}" stroke="rgba(0,0,0,0.4)" stroke-width="0.9" />
        <line x1="${x + 7.9}" y1="${AXIS - 15}" x2="${x + 7.9}" y2="${AXIS + 15}" stroke="rgba(255,255,255,0.8)" stroke-width="0.7" />`;
    }

    // One of the barrel's rings: a raised bead between two grooves, standing proud of the tube
    function ridgedRingMarkup(cx) {
      const line = (x, colour, w) => `<line x1="${x}" y1="${AXIS - 17}" x2="${x}" y2="${AXIS + 17}" stroke="${colour}" stroke-width="${w}" />`;
      return `<rect fill="url(#ring)" x="${cx - 5.5}" y="${AXIS - 18}" width="11" height="36" rx="2" />
        <rect fill="url(#ring)" x="${cx - 1.9}" y="${AXIS - 19.3}" width="3.8" height="38.6" rx="1.5" stroke-width="0.9" />
        ${line(cx - 3.6, 'rgba(0,0,0,0.38)', 0.9)}${line(cx - 2.9, 'rgba(255,255,255,0.8)', 0.6)}
        ${line(cx + 3.6, 'rgba(0,0,0,0.38)', 0.9)}${line(cx + 2.9, 'rgba(255,255,255,0.8)', 0.6)}`;
    }

    // The lip plate, looking straight down the hole, traced from a photograph: a loaf shape, arched on the far
    // side, flat and a little longer on the player's side (the bottom in this view), standing past the tube on both
    // sides. The hole sits toward the far side, where the blowing edge is, and the player's lip rests on the wide part
    // below it. Inside the hole the riser's wall catches the light.
    function lipPlateMarkup(tubeL, tubeR) {
      const outline = `M42.5,122 C42.7,114 46.4,106.5 52.8,102.4 C59.6,99.5 68.9,98.6 79.3,98.6 C89.6,98.6 98.9,99.5 105.3,102.4 C110.2,106 114.4,114 117.5,122
        C118.1,128 116.3,133 111.9,135.6 C108.3,137 104.6,137 101.6,137 L57.7,137 C53.9,137 50.2,137 47.2,135.6 C43.6,133 42.1,128 42.5,122 Z`;
      const hole = 'x="69" y="107" width="22" height="16" rx="7.5" ry="7"';
      return `
        <clipPath id="headTubeClip"><rect x="${tubeL}" y="${AXIS - TUBE}" width="${tubeR - tubeL}" height="${2 * TUBE}" /></clipPath>
        <clipPath id="holeClip"><rect ${hole} /></clipPath>
        <path d="${outline}" fill="none" stroke="rgba(0,0,0,0.24)" stroke-width="5" clip-path="url(#headTubeClip)" />
        <path d="${outline}" fill="url(#plate)" />
        <path d="${outline}" fill="url(#plateEnds)" stroke="none" />
        <path d="M53,104.2 C60.5,101.5 69,100.9 79.3,100.9 C89.5,100.9 98,101.5 105.5,104.2" fill="none" stroke="#5d6369" stroke-width="1.7" stroke-linecap="round" opacity="0.55" />
        <path d="M47.5,131.6 C60,133.5 100,133.5 112.5,131.6" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />
        <rect ${hole} fill="url(#riser)" stroke="none" />
        <g clip-path="url(#holeClip)" stroke="none">
          <rect x="69.5" y="105" width="21" height="14" rx="7" ry="6.6" fill="#17140f" />
          <path d="M71.5,121 C76,122 84,122 88.5,121" fill="none" stroke="#efe8d6" stroke-width="0.9" stroke-linecap="round" opacity="0.8" />
        </g>
        <rect ${hole} fill="none" stroke="#3f444a" stroke-width="1" />
        <path d="M73.5,105.9 C77.5,105.3 82.5,105.3 86.5,105.9" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" />
        <path d="M71.5,124.3 C76,125.3 84,125.3 88.5,124.3" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9" />`;
    }

    function fluteBody(underRods) {
      const headEnd = px(118), barrelEnd = px(160), bodyEnd = px(480), footStart = px(492), footEnd = px(654);
      const bodyRodStart = px(186);   // the keywork starts well below the socket
      const bodyPosts = [189, 202, 219, 244, 272, 294, 317, 366, 392, 421, 452, 475].map(px);
      return `
        <defs>
          <linearGradient id="tube" x1="0" y1="${AXIS - TUBE}" x2="0" y2="${AXIS + TUBE}" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#cfd3d8" /><stop offset="0.18" stop-color="#ffffff" />
            <stop offset="0.42" stop-color="#e2e5e9" /><stop offset="0.72" stop-color="#8f959c" />
            <stop offset="0.9" stop-color="#6f757c" /><stop offset="1" stop-color="#a3a8ae" />
          </linearGradient>
          <linearGradient id="ring" x1="0" y1="${AXIS - TUBE - 2}" x2="0" y2="${AXIS + TUBE + 2}" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#b9bec4" /><stop offset="0.2" stop-color="#ffffff" />
            <stop offset="0.5" stop-color="#d0d4d8" /><stop offset="0.8" stop-color="#737980" /><stop offset="1" stop-color="#8e949a" />
          </linearGradient>
          <linearGradient id="rod" x1="0" y1="${ROD - 3}" x2="0" y2="${ROD + 3}" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f2f3f5" /><stop offset="0.5" stop-color="#b6bbc1" /><stop offset="1" stop-color="#6b7178" />
          </linearGradient>
          <linearGradient id="rodBody" x1="0" y1="${ROD_BODY - 3}" x2="0" y2="${ROD_BODY + 3}" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f2f3f5" /><stop offset="0.5" stop-color="#b6bbc1" /><stop offset="1" stop-color="#6b7178" />
          </linearGradient>
          <radialGradient id="cup" cx="0.4" cy="0.35" r="0.72">
            <stop offset="0" stop-color="#ffffff" /><stop offset="0.6" stop-color="#d3d7db" /><stop offset="1" stop-color="#858b92" />
          </radialGradient>
          <radialGradient id="dome" cx="0.42" cy="0.38" r="0.7">
            <stop offset="0" stop-color="#ffffff" /><stop offset="0.7" stop-color="#e3e6ea" /><stop offset="1" stop-color="#a9aeb4" />
          </radialGradient>
          <!-- the little finger's keys: shading laid over a roller in any colour, and the polished silver of the rest -->
          <linearGradient id="barrelShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0.16" /><stop offset="0.17" stop-color="#fff" stop-opacity="0.85" />
            <stop offset="0.42" stop-color="#fff" stop-opacity="0.1" /><stop offset="0.72" stop-color="#000" stop-opacity="0.16" />
            <stop offset="1" stop-color="#000" stop-opacity="0.4" />
          </linearGradient>
          <linearGradient id="barrelSilver" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4f5f6" /><stop offset="0.5" stop-color="#c2c6cb" /><stop offset="1" stop-color="#777d84" />
          </linearGradient>
          <linearGradient id="strapSilver" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f7f8f9" /><stop offset="0.55" stop-color="#ced2d6" /><stop offset="1" stop-color="#868c93" />
          </linearGradient>
          <linearGradient id="touch" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" /><stop offset="0.5" stop-color="#e4e7ea" /><stop offset="1" stop-color="#b4b9bf" />
          </linearGradient>
          <linearGradient id="gizBody" gradientUnits="userSpaceOnUse" x1="845" y1="119" x2="859" y2="135">
            <stop offset="0" stop-color="#ffffff" /><stop offset="0.4" stop-color="#e9ecef" />
            <stop offset="0.75" stop-color="#c2c7cc" /><stop offset="1" stop-color="#8d939a" />
          </linearGradient>
          <radialGradient id="gizDome" cx="0.42" cy="0.38" r="0.62">
            <stop offset="0" stop-color="#fff" stop-opacity="1" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <!-- the lip plate: polished silver, brightest on top, a reflection line across it below the hole -->
          <linearGradient id="plate" x1="0" y1="98.6" x2="0" y2="137" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d9dce0" /><stop offset="0.13" stop-color="#f3f4f6" /><stop offset="0.42" stop-color="#ffffff" />
            <stop offset="0.56" stop-color="#e2e5e8" /><stop offset="0.6" stop-color="#c3c7cc" /><stop offset="0.66" stop-color="#eff1f3" />
            <stop offset="0.86" stop-color="#d4d7db" /><stop offset="1" stop-color="#8d939a" />
          </linearGradient>
          <linearGradient id="plateEnds" x1="42" y1="0" x2="118" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3c4146" stop-opacity="0.32" /><stop offset="0.09" stop-color="#3c4146" stop-opacity="0" />
            <stop offset="0.9" stop-color="#3c4146" stop-opacity="0" /><stop offset="1" stop-color="#3c4146" stop-opacity="0.4" />
          </linearGradient>
          <!-- the riser: the metal wall inside the hole, catching the light -->
          <linearGradient id="riser" x1="0" y1="107" x2="0" y2="123" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4a4238" /><stop offset="0.55" stop-color="#8d8169" /><stop offset="1" stop-color="#c9bea6" />
          </linearGradient>
        </defs>
        <g stroke="${EDGE}" stroke-width="1.2" stroke-linejoin="round">
          <!-- head joint: the tube narrows a little toward the crown -->
          <path fill="url(#tube)" d="M${HEAD_TUBE_X},${AXIS - 14.2} L${headEnd},${AXIS - TUBE} L${headEnd},${AXIS + TUBE} L${HEAD_TUBE_X},${AXIS + 14.2} Z" />
          ${crownMarkup()}
          ${lipPlateMarkup(HEAD_TUBE_X, headEnd)}
          <!-- the barrel: the socket the head joint slides into, a ridged ring at each end -->
          ${tubeRect(headEnd, barrelEnd, TUBE + 0.6, 'url(#tube)')}
          ${ridgedRingMarkup(headEnd)}
          <!-- body, with its lower ring -->
          ${tubeRect(barrelEnd, bodyEnd, TUBE, 'url(#tube)')}
          ${ridgedRingMarkup(barrelEnd)}
          ${tubeRect(bodyEnd - 5, bodyEnd, TUBE + 0.8, 'url(#ring)', 1.5)}
          <!-- foot joint (B foot): its socket over the body's tenon, then the tube to the open end -->
          ${tubeRect(bodyEnd, footStart, TUBE + 1.8, 'url(#ring)', 2.5)}
          ${tubeRect(footStart, footEnd, TUBE, 'url(#tube)')}
          ${tubeRect(footEnd - 7, footEnd, TUBE + 0.8, 'url(#ring)', 1.5)}
        </g>
        <!-- ribs along the tube, the posts on them, and the rods the keys turn on -->
        <g stroke="${EDGE}" stroke-width="0.8">
          <rect fill="#9aa0a6" x="${bodyRodStart}" y="${AXIS + TUBE - 2}" width="${bodyEnd - bodyRodStart - 4}" height="3" rx="1" />
          ${bodyPosts.map(x => `<rect fill="#aeb3b9" x="${x - 2.5}" y="${AXIS + TUBE - 1}" width="5" height="${ROD_BODY - AXIS - TUBE + 2}" rx="1" />`).join('')}
        </g>
        ${underRods}
        <g stroke="${EDGE}" stroke-width="0.8">
          <rect fill="url(#rodBody)" x="${bodyRodStart}" y="${ROD_BODY - 2.8}" width="${bodyEnd - bodyRodStart - 6}" height="5.6" rx="2.8" />
        </g>
        ${labelView === 'fingers' ? `<g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" font-size="15">
          <text x="${(px(OPEN_CUPS.L1.mm) + px(OPEN_CUPS.A.mm)) / 2}" y="78" fill="#9900cc">Left hand</text>
          <text x="${(px(OPEN_CUPS.Fs.mm) + px(OPEN_CUPS.E.mm)) / 2}" y="78" fill="#009900">Right hand</text>
        </g>` : ''}`;
    }

    // The pointed arm from a body cup down to its rod. It is part of the key, so it takes the colour when the cup is down.
    function armMarkup(c, paint) {
      const x = px(c.mm), r = c.r || CUP, cy = AXIS + (c.dy || 0);
      const top = cy + r * 0.55, end = c.dy ? ROD_G : ROD_BODY;
      return `<path fill="${paint ? paint.fill : '#aeb3b9'}" stroke="${paint ? paint.edge : EDGE}" stroke-width="0.7" stroke-linejoin="round"
        d="M${x - r * 0.62},${top} L${x + r * 0.62},${top} L${x + 1.7},${end} L${x - 1.7},${end} Z" />`;
    }

    // A foot cup's arm: a long point from the rod onto the cup. It lies on top of the cup, and stops short of the
    // cup's name in the Names view.
    function footArmMarkup(c, paint) {
      const x = px(c.mm), tip = labelView === 'names' ? 122 : AXIS + c.dy - 1;
      return `<path fill="${paint ? paint.fill : 'url(#strapSilver)'}" stroke="${paint ? paint.edge : EDGE}" stroke-width="0.8" stroke-linejoin="round"
        d="M${x - 2.4},${ROD - 4} L${x + 2.4},${ROD - 4} L${x + 2.1},${ROD + 3} L${x + 0.9},${tip - 3} L${x},${tip} L${x - 0.9},${tip - 3} L${x - 2.1},${ROD + 3} Z" />`;
    }

    // A length of rod, in silver or in the note's colour
    function barMarkup(x1, x2, y, r, paint) {
      const attrs = `x="${x1}" y="${y - r}" width="${x2 - x1}" height="${2 * r}" rx="${r}"`;
      return `<rect ${attrs} fill="${paint ? paint.fill : '#d4d7db'}" stroke="${paint ? paint.edge : EDGE}" stroke-width="${paint ? 1.2 : 0.8}" />
        <rect ${attrs} fill="url(#barrelShade)" />`;
    }

    // The links the eye needs to see: the G cups' own short rod, and the stretch of rod between the left 1 plate
    // and the C♯ cup it closes, both in the note's colour while they are down
    function linkMarkup(closed, paint) {
      const g1 = px(OPEN_CUPS.A.mm) - 9, g2 = px(OPEN_CUPS.Gf.mm) + 9;
      let out = barMarkup(g1, g2, ROD_G, 2.4, closed.has('A') ? paint : null);
      [g1, g2 - 2.4].forEach(x => {
        out += `<rect x="${x}" y="${ROD_G - 3.6}" width="2.4" height="7.2" rx="1" fill="url(#barrelSilver)" stroke="${EDGE}" stroke-width="0.6" />`;
      });
      if (closed.has('L1')) out += barMarkup(px(OPEN_CUPS.Cs.mm) - 3, px(OPEN_CUPS.L1.mm) + 3, ROD_BODY, 2.8, paint);
      return out;
    }

    // A cup on its hole (silver, or the note's colour while a finger holds it there), or lifted off it
    function cupMarkup(c, isClosed, paint) {
      const x = px(c.mm), r = c.r || CUP;
      const y = AXIS + (c.dy || 0);
      // Its name always in the Names view; the finger's name only while pressed in the Fingers view
      const label = labelView === 'names' ? c.name : (labelView === 'fingers' && paint && c.finger) || '';
      const size = c.nameSize || Math.max(r * 0.88, 7.5);
      const labelAt = cy => label ? `<text x="${x}" y="${cy + (c.nameDy || 0) + size * 0.36}" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="${size}" text-anchor="middle" fill="${paint ? paint.text : '#4b5563'}">${closeFlat(label, size)}</text>` : '';
      let out = '';
      if (isClosed || c.plate) {   // a plate has no hole: it sits the same whether it is down or not
        out += `<circle cx="${x}" cy="${y + 1.5}" r="${r}" fill="rgba(0,0,0,0.25)" />`;   // its shadow on the tube
        out += `<circle cx="${x}" cy="${y}" r="${r}" fill="${paint ? paint.fill : 'url(#cup)'}" stroke="${paint ? paint.edge : EDGE}" stroke-width="${paint ? 2 : 1.2}" />`;
        out += paint
          ? `<circle cx="${x}" cy="${y}" r="${r * 0.68}" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1" />`
          : `<circle cx="${x}" cy="${y}" r="${r * 0.68}" fill="url(#dome)" stroke="rgba(0,0,0,0.16)" stroke-width="0.8" />
             <ellipse cx="${x - r * 0.28}" cy="${y - r * 0.3}" rx="${r * 0.24}" ry="${r * 0.13}" fill="#ffffff" opacity="0.8" />`;
        out += labelAt(y);
      } else {
        // lifted off its hole, swinging up on its rod: seen from above it leans toward the rod, and the hole
        // shows along the edge away from it (the top edge on the body, the bottom edge on the foot)
        const lean = c.mm < 480 ? y + 5 : y - 5;
        out += `<circle cx="${x}" cy="${y}" r="${r * 0.8}" fill="#2b2e33" stroke="#9aa0a6" stroke-width="1.2" />`;
        out += `<ellipse cx="${x}" cy="${lean}" rx="${r}" ry="${r * 0.84}" fill="url(#cup)" stroke="${EDGE}" stroke-width="1.2" />
          <ellipse cx="${x}" cy="${lean - 0.5}" rx="${r * 0.68}" ry="${r * 0.56}" fill="url(#dome)" stroke="rgba(0,0,0,0.16)" stroke-width="0.8" />
          <ellipse cx="${x - r * 0.28}" cy="${lean - r * 0.3}" rx="${r * 0.24}" ry="${r * 0.11}" fill="#ffffff" opacity="0.8" />`;
        out += labelAt(lean - 0.5);
      }
      return out;
    }

    // What the touch pieces say: nothing in the Keys view, who plays them in Fingers, what they are called in Names.
    // A touch and the cup it moves share a name.
    const TOUCHES = {
      Gs:   { finger: 'L4', name: 'G♯' },
      Tb:   { finger: 'LT', name: 'thumb B♭' },
      T:    { finger: 'LT', name: 'thumb B' },
      BbL:  { finger: 'R1', name: 'B♭ lever' },
      trD:  { finger: 'R2', name: 'D trill' },
      trDs: { finger: 'R3', name: 'D♯ trill' },
      Eb:   { finger: 'R4', name: 'E♭' },
      Cs:   { finger: 'R4', name: 'C♯' },
      C:    { finger: 'R4', name: 'C' },
      B:    { finger: 'R4', name: 'B' },
      giz:  { finger: 'R4', name: 'gizmo' },
    };
    const touchCaption = id => labelView === 'keys' ? '' : TOUCHES[id][labelView === 'fingers' ? 'finger' : 'name'];

    // The finger's name on a key while it is pressed, in the Fingers view
    function fingerOnKey(id, pressed, paint, x, y, size = 12) {
      if (!pressed || labelView !== 'fingers') return '';
      return `<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="${size}" text-anchor="middle" fill="${paint.text}">${TOUCHES[id].finger}</text>`;
    }

    // The ♭ comes with a wide gap in front of it: close it up, as the note buttons do
    const closeFlat = (text, size) => text.replace('♭', `<tspan dx="${(-0.18 * size).toFixed(1)}">♭</tspan>`);

    function capText(x, y, text, anchor) {
      if (!text) return '';
      return `<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="${anchor || 'middle'}" fill="#6b7280">${closeFlat(text, 9)}</text>`;
    }

    // The G♯ key, the thumb keys, the B♭ lever and the trill keys keep the shapes and places flutists know them
    // by from the fingering charts, rather than showing their linkage (the G♯ really does reach its rod):
    //   G♯: a ⌐, its rounded touch reaching headward above the left ring finger's cup, a straight leg on the foot
    //     side that crosses the tube between the two G cups, the way it does on a real flute
    //   thumb B♭: a hook, its rounded foot toward the head and a long bar running footward along the tube
    //   thumb B: nested under that bar, a bump toward the head and a tail running footward
    //   B♭ lever: a bulge just head-side of the right index finger's cup, its bar running headward
    //   trill keys: small upright pills, between the right hand's cups at the rod
    function chartKeyMarkup(d, shine, pressed, paint) {
      return `<path d="${d}" transform="translate(0.6 1)" fill="rgba(0,0,0,0.2)" />
        <path d="${d}" fill="${pressed ? paint.fill : 'url(#touch)'}" stroke="${pressed ? paint.edge : EDGE}" stroke-width="${pressed ? 1.8 : 1.1}" stroke-linejoin="round" />
        <path d="${shine}" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="${pressed ? 0.55 : 0.95}" />`;
    }

    function gSharpMarkup(pressed, paint) {
      let out = chartKeyMarkup(
        'M573,72 L589,72 C593.4,72 596,74.6 596,79 L596,138 C596,139.5 595,140.5 593.5,140.5 L591.5,140.5 C590,140.5 589,139.5 589,138 L589,87 L573,87 C568.6,87 565,83.6 565,79.5 C565,75.4 568.6,72 573,72 Z',
        'M569.5,77.2 C570.6,76 572,75.4 573.5,75.4 L588,75.4 C590.8,75.4 592.6,77 592.6,79.6 L592.6,136', pressed, paint);
      return out + fingerOnKey('Gs', pressed, paint, 579, 84, 11) + capText(580.5, 67, touchCaption('Gs'));
    }

    function thumbKeysMarkup(keys, paint) {
      // Under the left 1 plate and the B♭ cup, clear of the rod
      let out = '<g transform="translate(35 4)">' + chartKeyMarkup(
        'M488,143 L417,143 C412.6,143 410,145.8 410,150 L410,171 C410,175 412.4,177 416,177 L421,177 C424.6,177 427,175 427,171 L427,154.5 C427,152.6 428,151.5 430,151.5 L488,151.5 Z',
        'M413.6,160 L413.6,150.5 C413.6,148 415.2,146.6 417.6,146.6 L484,146.6', keys.has('Tb'), paint);
      out += chartKeyMarkup(
        'M488,157.7 L434.5,157.7 C433,157.7 432,158.7 432,160.2 L432,170 C432,174.4 434.6,177 439,177 L451,177 C455,177 458,174.4 458.6,170.5 C459,168 460.4,167 463,167 L488,167 Z',
        'M435.6,168 L435.6,162.6 C435.6,161.6 436.2,161 437.2,161 L484,161', keys.has('T'), paint);
      out += fingerOnKey('Tb', keys.has('Tb'), paint, 418.5, 169.5, 10.5) + fingerOnKey('T', keys.has('T'), paint, 445, 172.5);
      return out + capText(418.5, 188, touchCaption('Tb')) + capText(462, 188, touchCaption('T')) + '</g>';
    }

    function sideKeysMarkup(keys, paint) {
      const pill = (x, top, bottom, r) => `M${x - r},${top + r} A${r},${r} 0 0 1 ${x + r},${top + r} L${x + r},${bottom - r} A${r},${r} 0 0 1 ${x - r},${bottom - r} Z`;
      const between = (a, b) => (px(OPEN_CUPS[a].mm) + px(OPEN_CUPS[b].mm)) / 2;
      const trD = between('Fs', 'F'), trDs = between('F', 'E');
      // The B♭ lever is drawn for a place 12 px head-side of here and 4 px higher
      let out = '<g transform="translate(12 4)">' + chartKeyMarkup(
        'M632.5,141 L649.5,141 C652,141 653,139.8 653.4,137.6 C654,133.6 656.6,131 660.2,131 C664,131 666.6,133.8 666.6,137.6 L666.6,141 C666.6,144 664.6,146 661.6,146 L632.5,146 C631,146 630,145 630,143.5 C630,142 631,141 632.5,141 Z',
        'M633,143.2 L650.4,143.2 C654,143.2 655.4,141 656,138 C656.4,135.8 657.6,134.2 659.4,133.8', keys.has('BbL'), paint)
        + capText(648, 156, touchCaption('BbL')) + '</g>';
      [[trD, 'trD'], [trDs, 'trDs']].forEach(([x, id]) => {
        out += chartKeyMarkup(pill(x, 127, 143, 3.7), `M${x - 1.4},${130.6} L${x - 1.4},${139.4}`, keys.has(id), paint);
        out += capText(x, 156, touchCaption(id));
      });
      return out;
    }

    // A roller: a polished barrel along the tube, a collar at its far end, its axle between two little arms,
    // and its label on the barrel
    function rollerMarkup(cy, pressed, paint, label) {
      const { rollerL: a, rollerR: b, R: r, lugL, lugR } = LF;
      const barrel = `M${a + 3},${cy - r + 0.5} C${a + 9},${cy - r - 0.4} ${b - 9},${cy - r - 0.4} ${b - 3},${cy - r + 0.5}
        C${b - 0.6},${cy - r + 1} ${b},${cy - r * 0.6} ${b},${cy} C${b},${cy + r * 0.6} ${b - 0.6},${cy + r - 1} ${b - 3},${cy + r - 0.5}
        C${b - 9},${cy + r + 0.4} ${a + 9},${cy + r + 0.4} ${a + 3},${cy + r - 0.5}
        C${a + 0.6},${cy + r - 1} ${a},${cy + r * 0.6} ${a},${cy} C${a},${cy - r * 0.6} ${a + 0.6},${cy - r + 1} ${a + 3},${cy - r + 0.5} Z`;
      return `<rect fill="#c4c8cd" stroke="${EDGE}" stroke-width="0.5" x="${lugL}" y="${cy - 1.1}" width="${lugR - lugL}" height="2.2" />
        <rect fill="url(#barrelSilver)" stroke="${EDGE}" stroke-width="0.6" x="${b + 0.7}" y="${cy - r * 0.68}" width="2.2" height="${r * 1.36}" rx="0.9" />
        <path d="${barrel}" fill="${pressed ? paint.fill : '#e3e6e9'}" stroke="${pressed ? paint.edge : EDGE}" stroke-width="${pressed ? 1.6 : 1}" />
        <path d="${barrel}" fill="url(#barrelShade)" />
        <path d="M${a + 4},${cy - r * 0.46} L${b - 5},${cy - r * 0.46}" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="${pressed ? 0.55 : 0.9}" fill="none" />
        ${label ? `<text x="${(a + b) / 2}" y="${cy + 2.9}" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="8" text-anchor="middle"
          fill="${pressed ? paint.text : '#4b5563'}">${label}</text>` : ''}`;
    }

    // A ball-topped post on the rod
    function ballMarkup(x, y, r) {
      return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#cup)" stroke="${EDGE}" stroke-width="0.9" />
        <ellipse cx="${x - r * 0.3}" cy="${y - r * 0.35}" rx="${r * 0.32}" ry="${r * 0.22}" fill="#ffffff" opacity="0.9" />`;
    }

    // The foot's rods. The main one carries the keys; past the collar it belongs to the last cup alone, and the gizmo
    // reaches that piece along its own rod at the top of the tube.
    function footRodsMarkup(gizmoDown, paint) {
      const { rod2, collar, rodEnd } = LF, giz = gizmoDown ? paint : null;
      return barMarkup(842, collar - 2, ROD, 2.8, null) + barMarkup(collar + 2, rodEnd, ROD, 2.8, giz) + barMarkup(847, collar, rod2, 2.4, giz)
        + `<rect x="${collar - 2.2}" y="${rod2 - 3.4}" width="4.4" height="${ROD - rod2 + 6.8}" rx="1.4" fill="${giz ? giz.fill : 'url(#barrelSilver)'}" stroke="${giz ? giz.edge : EDGE}" stroke-width="${giz ? 1.2 : 0.8}" />`
        + ballMarkup(894, ROD, 3.2) + ballMarkup(948, ROD, 3.2) + ballMarkup(rodEnd + 1, ROD, 3.2);
    }

    // The gizmo's touch: a strap off its rod that flares into a comma-shaped pad at the end of the rollers
    function gizmoPadMarkup(pressed, paint) {
      const fill = pressed ? paint.fill : null, edge = pressed ? paint.edge : EDGE;
      const comma = `M847,106.5 L851.8,106.5 L851.8,117.5 C851.9,119.8 853.2,121 855,122 C857.4,123.4 858.4,125.7 858,128.2
        C857.4,131.9 854,134.2 850,134 C846.7,133.8 844.6,131.4 844.6,128.2 C844.6,125.2 846,122.6 846.5,119.5 Z`;
      const dome = `M847.4,127.6 C847.2,125.2 849.2,123.6 851.6,123.8 C854.4,124 856.2,126 855.8,128.2 C855.4,130.6 853,132.2 850.6,131.9 C848.6,131.7 847.5,130 847.4,127.6 Z`;
      return `
          <path d="${comma}" transform="translate(0.9 1.5)" fill="rgba(0,0,0,0.3)" />
          <path d="${comma}" fill="${fill || 'url(#gizBody)'}" stroke="${edge}" stroke-width="${pressed ? 1.5 : 1}" stroke-linejoin="round" />
          <path d="${dome}" fill="url(#gizDome)" stroke="rgba(0,0,0,0.16)" stroke-width="0.6" opacity="${pressed ? 0.5 : 1}" />
          <path d="M846.4,128 C846.6,125.6 848,123.6 850,122.9" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="${pressed ? 0.65 : 1}" />
          <path d="M856.9,129.6 C856,131.8 853.8,133 851.4,133" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1" stroke-linecap="round" />
          <path d="M848.5,109 L848.5,119" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="${pressed ? 0.55 : 0.95}" />`;
    }

    // The D♯ cup, on the far side of the tube: nearly edge-on along its top, and it rises when the E♭ key opens it.
    // Under the rods.
    function eFlatCupMarkup(open) {
      const x = px(DS_CUP.mm), { rx, ry, y } = DS_CUP, cy = open ? y - 4 : y;
      let out = open ? `<ellipse cx="${x}" cy="${y + 1}" rx="${rx * 0.82}" ry="${ry * 0.82}" fill="#2b2e33" stroke="#9aa0a6" stroke-width="1" />`
        : `<ellipse cx="${x}" cy="${y + 1.2}" rx="${rx}" ry="${ry}" fill="rgba(0,0,0,0.25)" />`;
      out += `<ellipse cx="${x}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#cup)" stroke="${EDGE}" stroke-width="1.2" />
        <ellipse cx="${x}" cy="${cy - 0.3}" rx="${rx * 0.68}" ry="${ry * 0.62}" fill="url(#dome)" stroke="rgba(0,0,0,0.16)" stroke-width="0.8" />
        <ellipse cx="${x - rx * 0.3}" cy="${cy - ry * 0.34}" rx="${rx * 0.22}" ry="${ry * 0.14}" fill="#ffffff" opacity="0.8" />`;
      if (labelView === 'names') out += `<text x="${x}" y="${cy + 2.2}" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" fill="#4b5563">${closeFlat('E♭', 9)}</text>`;
      return out;
    }

    // The E♭ key: a ball-topped post beside the socket and a short hinge tube, with a pointed arm up onto the D♯ cup;
    // a strap off the tube, running down the foot side of the touch as a raised rib; and the touch itself, narrow at
    // the top and rounding out toward the head side (flat on the foot side, toward the rollers).
    function eFlatMarkup(pressed, paint, cupOpen) {
      const post = 798, csp = px(DS_CUP.mm), strap = 813.4;
      const fill = pressed ? paint.fill : null, edge = pressed ? paint.edge : EDGE;
      const touch = `M815.6,120 L815.6,146 C815.6,150.6 812.2,153 807.5,153 C800.8,153 796,147.5 796,140 C796,134 799,130.5 803,127.6 C806,125.4 808.6,123.6 809.4,120 Z`;
      // The arm rides up with the cup, and stops short of the cup's name in the Names view
      const tip = labelView === 'names' ? 107 : (cupOpen ? 98 : 102);
      return `
        <path d="M${csp - 2.2},${ROD} L${csp + 2.2},${ROD} L${csp + 1.4},${tip + 3} L${csp},${tip} L${csp - 1.4},${tip + 3} Z"
          fill="${fill || 'url(#strapSilver)'}" stroke="${edge}" stroke-width="0.8" stroke-linejoin="round" />
        <rect x="${post}" y="${ROD - 3.3}" width="${840 - post}" height="6.6" rx="2" fill="${fill || 'url(#rod)'}" stroke="${edge}" stroke-width="${pressed ? 1.2 : 0.9}" />
        ${pressed ? `<rect x="${post}" y="${ROD - 3.3}" width="${840 - post}" height="6.6" rx="2" fill="url(#barrelShade)" />` : ''}
        ${ballMarkup(post, ROD, 4.2)}
        <path d="${touch}" transform="translate(0.6 1)" fill="rgba(0,0,0,0.2)" />
        <path d="${touch}" fill="${fill || 'url(#touch)'}" stroke="${edge}" stroke-width="${pressed ? 1.8 : 1.1}" stroke-linejoin="round" />
        <path d="M799.2,141 C799,136.8 801.2,133.6 804.4,131.2" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="${pressed ? 0.55 : 0.95}" />
        <path d="M800.6,148 C803,150.4 806.4,151 809.6,150.6" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="0.9" stroke-linecap="round" />
        <path d="M811.2,${ROD} L815.6,${ROD} L815.6,148.8 A2.2,2.2 0 0 1 811.2,148.8 Z" fill="${fill || 'url(#strapSilver)'}"
          stroke="${edge}" stroke-width="${pressed ? 1.2 : 0.7}" stroke-linejoin="round" />
        <path d="M812.5,${ROD + 3} L812.5,147" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="${pressed ? 0.5 : 0.9}" />
        ${ballMarkup(strap, ROD, 3.2)}
        ${capText(805, 166, touchCaption('Eb'))}
        ${fingerOnKey('Eb', pressed, paint, 804.5, 145, 11)}`;
    }

    // Everything the right little finger works beyond the E♭ key
    function littleFingerKeys(keys, paint) {
      const on = id => keys.has(id);
      const { csStrap, lugL, lugR, C, rod2 } = LF;
      const csFill = on('Cs') ? paint.fill : 'url(#touch)', csEdge = on('Cs') ? paint.edge : EDGE;
      const touch = `M818.5,136.6 L859.6,136.6 C861,136.6 861.7,137.3 861.7,138.7 L861.7,141.2 C861.7,142.5 861,143.2 859.6,143.2 L851,143.2
        C846.4,143.2 843.6,145.4 841,149 C838,153.2 834,155.6 828,155.6 C821.6,155.6 816.2,152.4 816,146 L816,139.2 C816,137.6 817,136.6 818.5,136.6 Z`;
      // Bottom to top: the arms and straps off the rod, the rollers, the C♯ touch; the gizmo's pad rides over them all
      let out = `<rect fill="url(#strapSilver)" stroke="${EDGE}" stroke-width="0.7" x="${lugL}" y="${ROD}" width="2.4" height="${C + 3 - ROD}" rx="1" />
        <rect fill="url(#strapSilver)" stroke="${EDGE}" stroke-width="0.7" x="${lugR}" y="${ROD}" width="2.2" height="${C + 3 - ROD}" rx="1" />
        <rect fill="${on('Cs') ? paint.fill : 'url(#strapSilver)'}" stroke="${csEdge}" stroke-width="0.8" x="${csStrap - 1.9}" y="${ROD}" width="3.8" height="${139 - ROD}" />`;
      out += rollerMarkup(C, on('C'), paint, touchCaption('C')) + rollerMarkup(LF.B, on('B'), paint, touchCaption('B'));
      out += `<path d="${touch}" transform="translate(0.6 1)" fill="rgba(0,0,0,0.2)" />
        <path d="${touch}" fill="${csFill}" stroke="${csEdge}" stroke-width="${on('Cs') ? 1.8 : 1.1}" stroke-linejoin="round" />
        <path d="M819.5,139.6 L842,139.6" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="${on('Cs') ? 0.55 : 0.95}" />
        <path d="M822,152.6 C826,153.8 831,153.6 835,151.6" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="0.9" stroke-linecap="round" />`;
      out += gizmoPadMarkup(on('giz'), paint);
      out += fingerOnKey('Cs', on('Cs'), paint, 829, 150) + capText(832, 166, touchCaption('Cs'));
      // The gizmo's name goes above the tube, on a line down to its strap
      if (labelView !== 'keys') out += `<line x1="849.4" y1="94" x2="849.4" y2="${rod2 - 3}" stroke="#9aa0a6" stroke-width="0.8" />` + capText(849.4, 91, touchCaption('giz'));
      return out;
    }

    function drawFlute(note, keys) {
      const svg = document.getElementById('flute');
      keys = keys || new Set();
      const { closed, eFlatOpen, thumb } = cupStates(keys);
      let out = '';
      // The note's colour on every key that is down for it
      let paint = null;
      if (note) {
        const mid = noteMid(note);
        paint = { fill: note.color, edge: darken(mid, 0.62), text: textColorOn(mid) };
        if (note.sharp) {
          // One blend along the flute: the lower letter's colour toward the head, the upper's toward the foot
          out += `<defs><linearGradient id="noteFill" gradientUnits="userSpaceOnUse" x1="${px(200)}" y1="0" x2="${px(620)}" y2="0">
            <stop offset="0" stop-color="${note.color}" /><stop offset="1" stop-color="${note.upperColor}" /></linearGradient></defs>`;
          paint.fill = 'url(#noteFill)';
        }
      }
      // The cups on the back: only their lower edges show under the tube
      REAR_CUPS.forEach(c => {
        out += `<circle cx="${px(c.mm)}" cy="${AXIS + TUBE + 5 - c.r}" r="${c.r}" fill="#8d939a" stroke="${EDGE}" stroke-width="1.2" />`;
      });
      out += `<circle cx="${px(THUMB_MM)}" cy="${AXIS + TUBE + 5 - CUP}" r="${CUP}" fill="${thumb && paint ? paint.fill : '#8d939a'}" stroke="${thumb && paint ? paint.edge : EDGE}" stroke-width="1.2" />`;
      out += fluteBody(eFlatCupMarkup(eFlatOpen));
      // The links and arms, then the cups along the tube
      out += linkMarkup(closed, paint);
      const onFoot = c => c.mm > 480;
      Object.entries(OPEN_CUPS).forEach(([id, c]) => { if (!onFoot(c)) out += armMarkup(c, closed.has(id) ? paint : null); });
      Object.entries(OPEN_CUPS).forEach(([id, c]) => {
        const down = closed.has(id);
        out += cupMarkup(c, down, down ? paint : null);
      });
      // The Fingers view: finger names (L1, R1 ...) beside the cups the fingers press, on the side each hand
      // comes from: the left hand's fingers reach over from above in this view, the right hand's from below
      if (labelView === 'fingers') {
        out += '<g font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">';
        Object.values(OPEN_CUPS).filter(c => c.finger).forEach(c => {
          const y = c.finger[0] === 'L' ? AXIS + (c.dy || 0) - (c.r || CUP) - 4 : ROD_BODY + 15;
          out += `<text x="${px(c.mm)}" y="${y}">${c.finger}</text>`;
        });
        out += '</g>';
      }
      // The foot's rods and arms lie on top of its cups
      out += footRodsMarkup(keys.has('giz'), paint);
      Object.entries(OPEN_CUPS).forEach(([id, c]) => { if (onFoot(c)) out += footArmMarkup(c, closed.has(id) ? paint : null); });
      // The touch pieces
      out += gSharpMarkup(keys.has('Gs'), paint) + thumbKeysMarkup(keys, paint) + sideKeysMarkup(keys, paint);
      out += eFlatMarkup(keys.has('Eb'), paint, eFlatOpen) + littleFingerKeys(keys, paint);
      svg.innerHTML = out;
      svg.setAttribute('aria-label', note ? `Fingering for ${note.name}` : 'Flute');
    }

    // ----- the printed chart's symbol for the same fingering -----
    // The common flute fingering chart, in the units of the chart the app was designed from (it lies the way the flute
    // does, head at the left, so each key can be found straight below): left hand with the thumb keys under it, the G♯
    // flag, the B♭ lever, right hand with the trills under it, the E♭ key, then the foot's B roller, C roller and C♯
    // stacked in that order with the gizmo beside them.
    const CHART_CIRCLES = { L1: [119, 33], L2: [225, 43], L3: [325, 43], R1: [500, 43], R2: [607, 43], R3: [715, 43] };
    const CHART_Y = 155;
    const chartPill = (cx, cy, rx, ry) => `M${cx - rx} ${cy - ry + rx}A${rx} ${rx} 0 0 1 ${cx + rx} ${cy - ry + rx}L${cx + rx} ${cy + ry - rx}A${rx} ${rx} 0 0 1 ${cx - rx} ${cy + ry - rx}Z`;
    const CHART_SHAPES = {
      Tb: 'M57 226Q57 212 71 212L212 212A10 10 0 0 1 212 232L110 232L110 272A26.5 26.5 0 0 1 57 272Z',
      T: 'M143 252L255 252A56 56 0 0 1 143 252Z',
      Gs: 'M355 42L406 42L406 158L392 158L392 73L355 73A15.5 15.5 0 0 1 355 42Z',
      BbL: 'M375 227L418 227C424 227 426 222 430 216C434 209 440 205 447 205C459 205 467 214 467 225C467 236 460 244 449 244L375 244Z',
      trD: chartPill(553, 221, 14, 23),
      trDs: chartPill(661, 221, 14, 23),
      Eb: 'M785 158L803 158L803 285L789 285C771 285 757 268 757 247C757 229 768 214 785 204Z',
      B: 'M831 140L907 140Q910 140 910 143L910 155Q910 158 907 158L831 158Q828 158 828 155L828 143Q828 140 831 140Z',
      C: 'M831 177L907 177Q910 177 910 180L910 193Q910 196 907 196L831 196Q828 196 828 193L828 180Q828 177 831 177Z',
      Cs: 'M828 212L912 212C912 234 892 248 870 248C848 248 828 234 828 212Z',
      giz: 'M931 148C935 158 945 168 945 181C945 190 939 197 931 197C923 197 917 190 917 181C917 168 927 158 931 148Z',
    };
    // A printed chart fills the keys that are closed, so the foot's keys add up: low C shows the C roller and the
    // C♯ key together, and low B all three.
    function chartKeysDown(keys) {
      const down = new Set(keys);
      if (down.has('B')) down.add('C');
      if (down.has('C')) down.add('Cs');
      return down;
    }
    function drawChart(note, keys) {
      const down = chartKeysDown(keys || []);
      const paint = on => `fill="${on ? '#1f2937' : '#fff'}" stroke="${on ? '#1f2937' : '#6b7280'}" stroke-width="3.6" stroke-linejoin="round"`;
      let out = '';
      Object.entries(CHART_CIRCLES).forEach(([k, [cx, r]]) => { out += `<circle cx="${cx}" cy="${CHART_Y}" r="${r}" ${paint(down.has(k))} />`; });
      Object.entries(CHART_SHAPES).forEach(([k, d]) => { out += `<path d="${d}" ${paint(down.has(k))} />`; });
      const svg = document.getElementById('chart');
      svg.innerHTML = out;
      svg.setAttribute('aria-label', note ? `Fingering chart for ${note.name}` : 'Fingering chart');
    }

    // ----- drawing the staff -----
    // Leland music glyphs (SIL Open Font Licence), 360 units to a staff space
    const GLYPHS = {
      gClef: 'M 809 30 C 809 132 768 238 665 279 C 635 107 596 -122 586 -186 C 716 -186 809 -98 809 30 Z M 605 297 C 576 302 549 305 521 305 C 315 305 140 161 140 -56 C 140 -232 264 -389 390 -498 C 415 -520 438 -540 459 -562 C 472 -484 482 -416 492 -357 C 361 -318 272 -180 272 -45 C 272 56 351 194 467 194 C 478 194 491 189 491 176 C 491 163 477 156 459 144 C 403 109 372 72 372 1 C 372 -86 436 -157 521 -177 Z M 478 -1184 C 491 -1241 557 -1392 632 -1392 C 654 -1392 688 -1322 688 -1223 C 688 -1073 577 -960 478 -863 C 469 -920 462 -976 462 -1037 C 462 -1090 467 -1139 478 -1184 Z M 176 739 C 176 834 249 959 444 959 C 511 959 570 942 622 910 C 700 855 720 760 720 670 C 720 613 711 549 697 467 C 693 438 684 395 675 338 C 816 292 922 145 922 -3 C 922 -220 768 -367 557 -367 C 543 -454 528 -539 516 -619 C 668 -779 773 -959 773 -1188 C 773 -1319 733 -1426 710 -1477 C 675 -1551 634 -1601 608 -1601 C 598 -1601 553 -1584 505 -1528 C 413 -1418 387 -1234 387 -1113 C 387 -1035 395 -965 419 -804 C 418 -802 343 -726 312 -701 C 181 -579 0 -405 0 -117 C 0 153 235 364 503 364 C 544 364 583 360 616 354 C 644 492 660 593 660 670 C 660 819 583 899 438 899 C 403 899 373 891 370 891 C 369 890 366 888 366 887 C 366 884 369 883 373 881 C 441 871 508 814 508 721 C 508 644 449 562 341 562 C 240 562 176 644 176 739 Z',
      noteheadBlack: 'M 0 60 C 0 122 45 192 161 192 C 311 192 468 69 468 -58 C 468 -143 396 -190 307 -190 C 167 -190 0 -72 0 60 Z',
      sharp: 'M 336 -151 C 344 -153 351 -163 351 -171 L 351 -256 C 351 -268 343 -276 331 -276 C 330 -276 330 -276 328 -276 L 281 -266 L 281 -481 L 240 -481 L 240 -258 L 112 -232 L 112 -435 L 72 -435 L 72 -223 L 16 -212 C 7 -210 0 -200 0 -192 L 0 -189 L 0 -105 L 0 -108 C 0 -96 9 -88 20 -88 C 22 -88 23 -88 24 -88 L 72 -98 L 72 140 L 16 151 C 7 153 0 163 0 171 L 0 255 C 0 266 9 275 20 275 C 22 275 23 275 24 275 L 72 265 L 72 480 L 112 480 L 112 256 L 240 230 L 240 433 L 281 433 L 281 222 L 336 212 C 344 210 351 200 351 192 L 351 107 C 351 95 343 86 331 86 C 330 86 330 86 328 86 L 281 96 L 281 -141 Z M 112 -107 L 240 -132 L 240 105 L 112 132 Z',
      flat: 'M 289 -114 C 281 -170 246 -223 173 -223 C 101 -223 59 -179 52 -170 L 58 -632 C 58 -644 49 -652 37 -652 L 20 -652 C 9 -652 0 -644 0 -632 L 7 233 C 7 245 16 253 27 253 C 30 253 36 252 39 251 C 45 248 138 202 216 114 C 271 52 292 -19 292 -78 C 292 -91 291 -102 289 -114 Z M 190 -58 C 190 -36 184 30 148 85 C 124 122 75 161 48 183 L 52 -98 C 55 -111 76 -153 134 -153 C 186 -153 190 -104 190 -73 C 190 -66 190 -62 190 -58 Z',
    };
    const SS = 12;                       // one staff space
    const GS = SS / 360;                 // glyph units -> px
    const STAFF_LEFT = 4, STAFF_RIGHT = 256;   // just room for the clef, one note with its accidental, and its name
    const NOTE_X = STAFF_LEFT + 100;
    const BOTTOM_LINE = 132;             // E4's line
    const yOfStep = step => BOTTOM_LINE - (step - 2) * (SS / 2);   // step: C4 = 0, D4 = 1 ...

    function drawStaff(note) {
      const svg = document.getElementById('staff');
      let out = '<g stroke="#1f2937" stroke-width="1.1">';
      for (let i = 0; i < 5; i++) {
        const y = BOTTOM_LINE - i * SS;
        out += `<line x1="${STAFF_LEFT}" y1="${y}" x2="${STAFF_RIGHT}" y2="${y}" />`;
      }
      out += `<line x1="${STAFF_LEFT}" y1="${BOTTOM_LINE - 4 * SS}" x2="${STAFF_LEFT}" y2="${BOTTOM_LINE}" stroke-width="1.4" />`;
      out += `<line x1="${STAFF_RIGHT}" y1="${BOTTOM_LINE - 4 * SS}" x2="${STAFF_RIGHT}" y2="${BOTTOM_LINE}" stroke-width="1.4" />`;
      out += '</g>';
      out += `<path fill="#1f2937" transform="translate(${STAFF_LEFT + 12} ${yOfStep(4)}) scale(${GS})" d="${GLYPHS.gClef}" />`;
      if (note) {
        const x = NOTE_X, y = yOfStep(note.step);
        const headW = 468 * GS;
        // Ledger lines, out from the staff as far as the note
        out += '<g stroke="#1f2937" stroke-width="1.1">';
        for (let s = 12; s <= note.step; s += 2) out += `<line x1="${x - headW / 2 - 6}" y1="${yOfStep(s)}" x2="${x + headW / 2 + 6}" y2="${yOfStep(s)}" />`;
        for (let s = 0; s >= note.step; s -= 2) out += `<line x1="${x - headW / 2 - 6}" y1="${yOfStep(s)}" x2="${x + headW / 2 + 6}" y2="${yOfStep(s)}" />`;
        out += '</g>';
        const mid = noteMid(note);
        const fill = note.sharp
          ? `url(#staffFill)` : note.color;
        if (note.sharp) {
          out += `<defs><linearGradient id="staffFill" gradientUnits="userSpaceOnUse" x1="${x - headW / 2}" y1="0" x2="${x + headW / 2}" y2="0">
            <stop offset="0" stop-color="${note.color}" /><stop offset="1" stop-color="${note.upperColor}" /></linearGradient></defs>`;
        }
        // Stem up below the middle line, down from it
        const stemUp = note.step < 6;
        const stemX = stemUp ? x + headW / 2 - 0.8 : x - headW / 2 + 0.8;
        out += `<line x1="${stemX}" y1="${y}" x2="${stemX}" y2="${stemUp ? y - 3.5 * SS : y + 3.5 * SS}" stroke="#1f2937" stroke-width="1.5" />`;
        out += `<path fill="${fill}" stroke="${darken(mid, 0.62)}" stroke-width="${1 / GS * 0.9}" transform="translate(${x - headW / 2} ${y}) scale(${GS})" d="${GLYPHS.noteheadBlack}" />`;
        if (note.accidental) {
          const g = note.accidental === '♯' ? 'sharp' : 'flat';
          const w = (g === 'sharp' ? 351 : 292) * GS;
          out += `<path fill="#1f2937" transform="translate(${x - headW / 2 - w - 5} ${y}) scale(${GS})" d="${GLYPHS[g]}" />`;
        }
        // The note's name beside it
        const label = note.sharp ? `${note.name}  ·  ${note.otherName}` : note.name;
        const bw = note.sharp ? 86 : 40;
        out += `<rect x="${x + 36}" y="${y - 13}" width="${bw}" height="26" rx="7" fill="${fill}" stroke="${darken(mid, 0.62)}" stroke-width="1.5" />
          <text x="${x + 36 + bw / 2}" y="${y + 6}" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16"
          text-anchor="middle" fill="${textColorOn(mid)}">${label}</text>`;
      }
      svg.innerHTML = out;
    }

    // ----- what's shown under the notes -----
    const tipArea = document.getElementById('tipArea');

    function showTips(note) {
      if (!note) {
        tipArea.innerHTML = '<span class="hint">Press a note to see how to play it. Hold Shift to play the computer keys an octave higher.</span>';
        return;
      }
      // A note with several fingerings shows the button and nothing else, the same button in the same place each
      // time, so pressing it again and again changes only the fingers
      if (note.fingerings.length > 1) {
        const which = chosenFingering[note.pitch] || 0;
        const label = `⇄ Other fingering (${which + 1} of ${note.fingerings.length})`;
        const button = document.getElementById('altBtn');
        if (button) button.textContent = label;
        else tipArea.innerHTML = `<button type="button" class="alt-btn" id="altBtn">${label}</button>`;
        return;
      }
      const keys = note.fingerings[0];
      const tips = [];
      if (keys.has('trD')) tips.push('<b>D trill key:</b> the right middle finger presses the small key between its key and the first.');
      if (keys.has('trDs')) tips.push('<b>D♯ trill key:</b> the right ring finger presses the small key between its key and the middle finger\'s.');
      if (keys.has('giz')) tips.push('<b>Gizmo:</b> the right little finger closes just the low B cup (B foot only). On a C foot, leave it out.');
      if (keys.has('C') || keys.has('B') || keys.has('Cs')) tips.push('<b>Right little finger</b> on the foot keys, and <b>off</b> the E♭ key.');
      if (/^D[45]$/.test(note.pitch)) tips.push('The E♭ key stays <b>up</b> for D.');
      tipArea.innerHTML = tips.map(t => `<div>${t}</div>`).join('');
    }

    tipArea.addEventListener('click', e => {
      if (!e.target.closest('#altBtn') || !shownNote) return;
      const count = shownNote.fingerings.length;
      chosenFingering[shownNote.pitch] = ((chosenFingering[shownNote.pitch] || 0) + 1) % count;
      showNote(shownNote);
    });

    function showNote(note) {
      shownNote = note;
      const fingering = note ? note.fingerings[chosenFingering[note.pitch] || 0] : null;
      drawFlute(note, fingering);
      drawChart(note, fingering);
      drawStaff(note);
      showTips(note);
      document.querySelectorAll('.note-btn.selected').forEach(b => b.classList.remove('selected'));
      if (note) buttonFor(note.pitch)?.classList.add('selected');
    }

    function buttonFor(pitch) {
      return notePad.querySelector(`.note-btn[data-pitch='${pitch}']`);
    }

    // ----- sound -----
    // flute-synth.js: the Virtual Recorder's synth (a physical model of an air jet and a pipe)
    // with a flute added: low B to top C, sounding as written.
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    const SOUND_DEFAULTS = Object.assign({}, window.RecorderSynth ? RecorderSynth.DEFAULTS : {}, {
      engine: 'waveguide',
      timbre: 'silver',
      size: 'flute',
      writtenPitch: false,
      mono: true,          // one note at a time; going from one note to the next slurs
      breath: 0.7,
      noise: 0.45,         // a flute is airier than a recorder
      vibrato: 0.4,
      vibratoDelay: 0.3,
      glide: 0.04,
    });

    const pct = v => Math.round(v * 100) + '%';
    const ms = v => Math.round(v * 1000) + ' ms';
    const SOUND_CHOICES = [
      { key: 'engine', label: 'Sound model', options: [
        ['waveguide', 'Waveguide', 'A physical model of the air and the tube. The most natural.'],
        ['spectral', 'Spectral', "Built from a flute's overtones."],
        ['fm', 'FM', 'A bright, simple electronic sound.'],
      ] },
      { key: 'timbre', label: 'Flute', options: [
        ['silver', 'Silver', 'Clear and bright, like a silver flute.'],
        ['woodflute', 'Wooden', 'Darker and softer, like a wooden flute.'],
      ] },
      { key: 'mono', label: 'One note at a time', options: [
        [true, 'On', 'Like a real flute. Going from one held key to the next slurs.'],
        [false, 'Off', 'Hold several keys to play several notes at once.'],
      ] },
    ];
    const SOUND_SLIDERS = [
      { group: 'Breath and tone' },
      { key: 'volume', label: 'Volume', min: 0, max: 1.5, step: 0.05, show: pct },
      { key: 'breath', label: 'Breath', min: 0.1, max: 1, step: 0.01, show: pct, ends: ['Gentle', 'Strong'],
        hint: 'Like a real flute: gentle is softer and a little flat, strong is louder, brighter and a little sharp.' },
      { key: 'attack', label: 'Tonguing', min: 0.005, max: 0.12, step: 0.005, show: ms, ends: ['"Tu" (crisp)', '"Du" (soft)'] },
      { key: 'chiff', label: 'Chiff', min: 0, max: 1, step: 0.01, show: pct,
        hint: 'The little puff of air at the start of each note.' },
      { key: 'noise', label: 'Breath noise', min: 0, max: 1, step: 0.01, show: pct,
        hint: 'Air you can hear along with the tone.' },
      { group: 'Vibrato' },
      { key: 'vibrato', label: 'Vibrato', min: 0, max: 1, step: 0.01, show: pct, ends: ['None', 'Lots'] },
      { key: 'vibratoRate', label: 'Vibrato speed', min: 2, max: 9, step: 0.1, show: v => v.toFixed(1) + ' per second' },
      { key: 'vibratoDelay', label: 'Vibrato starts after', min: 0, max: 1, step: 0.05, show: v => v.toFixed(2) + ' s' },
      { group: 'Room and feel' },
      { key: 'reverb', label: 'Room', min: 0, max: 1, step: 0.01, show: pct, ends: ['Dry', 'Big room'] },
      { key: 'drift', label: 'Wobble', min: 0, max: 1, step: 0.01, show: pct,
        hint: 'Slow, tiny changes in pitch, like a real player.' },
      { key: 'release', label: 'Note ending', min: 0.02, max: 0.5, step: 0.01, show: ms, ends: ['Short', 'Long'] },
      { key: 'glide', label: 'Slur speed', min: 0.005, max: 0.2, step: 0.005, show: ms, onlyIf: s => s.mono,
        hint: 'How quickly one note slides into the next. Needs "One note at a time".' },
      { key: 'pitchFollow', label: 'Pitch follows breath', min: 0, max: 1, step: 0.01, show: pct,
        onlyIf: s => s.engine !== 'waveguide', hint: 'Stronger breath bends the pitch up. The Waveguide does this by itself.' },
    ];

    // Saved values are only used when they are still one of the choices or inside a slider's range
    const soundSettings = Object.assign({}, SOUND_DEFAULTS);
    const savedSound = Object.assign({}, saved.sound);
    SOUND_CHOICES.forEach(c => {
      if (c.options.some(o => o[0] === savedSound[c.key])) soundSettings[c.key] = savedSound[c.key];
    });
    SOUND_SLIDERS.forEach(s => {
      const v = savedSound[s.key];
      if (s.key && typeof v === 'number' && v >= s.min && v <= s.max) soundSettings[s.key] = v;
    });

    let synth = null;
    const synthReady = window.RecorderSynth
      ? RecorderSynth.create(audioCtx, soundSettings).then(s => { s.connect(audioCtx.destination); synth = s; })
