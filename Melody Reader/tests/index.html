<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Melody Reader — tests</title>
  <style>
    body { font: 15px/1.45 system-ui, sans-serif; margin: 24px; color: #2b1d16; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sum { font-weight: 700; margin: 10px 0 16px; font-size: 18px; }
    .pass { color: #15803d; } .fail { color: #b91c1c; }
    li { margin: 2px 0; }
    small { color: #6b5446; }
  </style>
</head>
<body>
  <!-- The engine's own checks (IMPLEMENTATION.md, phases 2 and 5): the
       generator, the Songbook, the levels, the engraver, practices, lesson
       links, melody sets under the family library rules, the points
       (1–20 a melody, POINTS-AND-COUNT-IN.md), and My stats' history
       and charts (2026-10-07).
       Open through the server: http://localhost:8816/tests/  -->
  <h1>Melody Reader — tests</h1>
  <div class="sum" id="sum">Running…</div>
  <ol id="out"></ol>

  <script src="../lib/notation/glyphs-leland.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/engrave.js"></script>
  <script src="../js/songbook.js"></script>
  <script src="../js/melody.js"></script>
  <script src="../js/levels.js"></script>
  <script src="../js/teach-data.js"></script>
  <script src="../js/points.js"></script>
  <script src="../lib/instruments/js/virtual-instruments.js"></script>
  <script src="../js/drums.js"></script>
  <script src="../lib/evm-library.js"></script>
  <script src="../js/sets.js"></script>
  <script src="../js/lesson.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/charts.js"></script>
  <script>
  (function () {
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function check(name, ok, detail) {
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.innerHTML = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' <small>' + detail + '</small>' : '');
      out.appendChild(li);
      ok ? pass++ : fail++;
    }
    const RUNS = 300;

    // 1. the generator, every level (the ladder redone 2026-10-07: meters, pick-ups, leaps by interval)
    const DRAWN = [1, 2, 3, 4, 6, 8, 12, 16];
    RR.LEVELS.forEach(l => {
      const s = RR.practiceOfLevel(l.n), recent = [];
      const problems = [];
      let minNotes = 99, maxNotes = 0, picks = 0, laBased = 0, noLeap = 0;
      const melodies = new Set(), meters = new Set(), pool = s.notes.slice().sort((a, b) => RR.BAR[a].step - RR.BAR[b].step);
      for (let i = 0; i < RUNS; i++) {
        const m = RR.Melody.make(s, { recent });
        if (!m) { problems.push('no melody'); continue; }
        const barTicks = RR.meter(m.time).barTicks, p = m.pickup || 0;
        meters.add(RR.meterText(m.time)); if (p) picks++; if (m.la) laBased++;
        if (!s.times.some(t => t[0] === m.time[0] && t[1] === m.time[1])) problems.push('a meter outside the practice');
        if (p && !s.pickup) problems.push('a pick-up the practice has not');
        const sum = m.notes.reduce((a, n) => a + n.t, 0);
        if (sum !== s.bars * barTicks) problems.push('ticks ' + sum);
        if (m.notes.some(n => !DRAWN.includes(n.t))) problems.push('a length that can’t be drawn');
        if (m.notes.some(n => n.p && !s.notes.includes(n.p))) problems.push('a note outside the practice');
        if (!m.notes[0].p) problems.push('starts on a rest');
        if (!m.notes[m.notes.length - 1].p) problems.push('ends on a rest');
        for (let j = 1; j < m.notes.length; j++) if (!m.notes[j].p && !m.notes[j - 1].p) problems.push('two rests running');
        // nothing crosses a bar line (they come after the pick-up)
        let t = 0; m.notes.forEach(n => { if (Math.floor((t - p) / barTicks) !== Math.floor((t + n.t - 1 - p) / barTicks)) problems.push('crosses a bar line'); t += n.t; });
        const last = m.notes[m.notes.length - 1].p;
        if (m.la && last && last[0] !== 'A') problems.push('La-based, but ends on ' + last);
        else if (!m.la && s.endDo && (s.notes.includes('C4') || s.notes.includes('C5')) && last && last[0] !== 'C') problems.push('ends on ' + last + ', not Do');
        // the moves: Steps and Steps and skips by the practice's own notes; Leaps only the practice's, two kinds at most, one at least
        const ps = m.notes.filter(n => n.p).map(n => n.p), kinds = new Set();
        const home = ps.length;                                                  // the way home too: by an allowed move (2026-10-07)
        for (let j = 1; j < ps.length; j++) {
          const a = RR.BAR[ps[j - 1]], b = RR.BAR[ps[j]], di = Math.abs(pool.indexOf(ps[j]) - pool.indexOf(ps[j - 1]));
          if (s.moves === 'steps' && j < home && di > 1) problems.push('a skip in a Steps level');
          if (s.moves === 'skips' && j < home && di > 2) problems.push('a leap in a Skips level');
          if (s.moves === 'leaps' && Math.abs(b.step - a.step) >= 3 && di > 1) {
            const k = Object.keys(RR.Melody.LEAPS).find(x => RR.Melody.LEAPS[x] === Math.abs(b.midi - a.midi));
            if (!k || !s.leaps.includes(k)) problems.push('a leap of ' + Math.abs(b.midi - a.midi) + ' semitones'); else kinds.add(k);
          }
        }
        if (kinds.size > 2) problems.push('three kinds of leap in one melody');
        if (s.moves === 'leaps' && !kinds.size) noLeap++;
        const c = m.notes.filter(n => n.p).length;
        minNotes = Math.min(minNotes, c); maxNotes = Math.max(maxNotes, c);
        melodies.add(m.notes.map(n => (n.p || 'r') + n.t).join(' '));
        try { const g = RR.Eng.render(m, { ss: 20, maxW: 900, colour: s.colour, labels: 'syllables', judgeRow: true }); if (!(g.W > 0 && g.H > 0)) problems.push('drew nothing'); }
        catch (e) { problems.push('engraver: ' + e.message); }
      }
      const need = s.bars === 1 ? Math.min(3, s.time[0]) : 4;
      if (minNotes < need) problems.push('only ' + minNotes + ' notes');
      if (noLeap > RUNS * 0.02) problems.push(noLeap + ' melodies without a leap');
      if (s.pickup && (picks < RUNS * 0.3 || picks > RUNS * 0.7)) problems.push(picks + ' pick-ups in ' + RUNS);
      if (s.endLa && (laBased < RUNS * 0.3 || laBased > RUNS * 0.7)) problems.push(laBased + ' La-based in ' + RUNS);
      if (meters.size !== s.times.length) problems.push('meters seen: ' + Array.from(meters).join(' '));
      check('Level ' + l.n + ' · ' + l.name + ': ' + RUNS + ' made-up melodies', !problems.length,
        problems.length ? Array.from(new Set(problems)).slice(0, 4).join('; ') : minNotes + '–' + maxNotes + ' notes, ' + melodies.size + ' different' +
          (s.times.length > 1 ? ' · ' + Array.from(meters).join(' & ') : s.time[1] === 8 ? ' · 6/8' : '') + (s.pickup ? ' · ' + picks + ' with a pick-up' : '') + (s.endLa ? ' · ' + laBased + ' La-based' : ''));
    });
    // the ladder's shape (the user's sequences, 2026-10-07)
    const L = n => RR.LEVELS[n - 1];
    check('The notes come in a music teacher’s order: Mi So · La · Do · Re · high Do · Fa · Ti · the octave · D E · F · G',
      L(1).notes.join() === 'E4,G4' && L(2).notes.join() === 'E4,G4,A4' && L(3).notes.includes('C4') && L(4).notes.length === 5 && L(4).notes.includes('D4') &&
      L(5).notes.includes('C5') && !L(5).notes.includes('F4') && L(6).notes.includes('F4') && !L(6).notes.includes('B4') && L(7).notes.length === 8 && L(8).endLa &&
      !L(8).notes.some(id => RR.BAR[id].i > 7) && L(9).notes.includes('E5') && !L(9).notes.includes('F5') && L(10).notes.includes('F5') && L(11).notes.includes('G5'));
    check('Every level is made-up melodies only (no Songbook cards)', RR.LEVELS.every(l => !l.songs.length && l.from === 'made'));
    check('Every level before 15 leaves some bars out; Level 15 uses all twelve', RR.LEVELS.every(l => l.n === 15 ? l.notes.length === 12 : l.notes.length < 12));
    check('Leaps from Level 12: a 4th, a 5th, both — major 6ths only at Level 15', RR.LEVELS.every(l => (l.moves === 'leaps') === (l.n >= 12)) &&
      L(12).leaps.join() === 'P4' && L(13).leaps.join() === 'P5' && L(14).leaps.join() === 'P4,P5' && L(15).leaps.join() === 'P4,P5,M6');
    const firstAt = id => RR.LEVELS.find(l => l.rhythms.includes(id)).n;
    check('The rhythms come in the user’s order, ending with 6/8 and pick-ups at 14–15',
      firstAt('q') === 1 && firstAt('ee') === 1 && firstAt('qr') === 3 && firstAt('h') === 5 && firstAt('ssss') === 7 && firstAt('hr') === 9 && firstAt('w') === 9 &&
      firstAt('eqe') === 11 && firstAt('dqe') === 11 && firstAt('ess') === 13 && firstAt('c3') === 14 &&
      L(14).time.join('/') === '6/8' && L(14).pickup && L(15).times.length === 2 && L(15).pickup && RR.LEVELS.every(l => l.n >= 14 || (!l.pickup && l.time.join('/') === '4/4')),
      [3, 5, 7, 9, 11, 13].map(n => n + ': ' + RR.LEVELS[n - 1].rhythms.slice(-2).join(' ')).join(' · '));
    check('Each level’s focus is in the level', RR.LEVELS.every(l => l.focus.every(id => l.notes.includes(id) || l.rhythms.includes(id))));
    check('The ladder starts fresh: level scores live under new keys', RR.levelKey(7) === 'lv2:7');

    // 2. the Songbook
    Object.keys(RR.SONGS).forEach(id => {
      const bad = [];
      RR.Melody.songCards(id).forEach(c => {
        const sum = c.notes.reduce((a, n) => a + n.t, 0);
        if (sum % (c.time[0] * 4)) bad.push('card ' + c.part + ' has ' + sum + ' ticks');
        if (c.notes.some(n => n.p && !RR.BAR[n.p])) bad.push('card ' + c.part + ' has an unknown note');
        if (c.notes.some(n => n.p && RR.BAR[n.p].i >= 10)) bad.push('card ' + c.part + ' goes above E5');
        try { RR.Eng.render(c, { ss: 20, maxW: 900, colour: 'always' }); } catch (e) { bad.push('engraver: ' + e.message); }
      });
      check('Song: ' + RR.SONGS[id].title, !bad.length, bad.join('; '));
    });

    // 3. levels whose bars are greyed out have every song note live
    RR.LEVELS.filter(l => l.grey).forEach(l => {
      const missing = [];
      l.songs.forEach(id => RR.Melody.songNotes(id).forEach(n => { if (!l.notes.includes(n)) missing.push(n); }));
      check('Level ' + l.n + ': its songs only use its live bars', !missing.length, missing.join(' '));
    });
    check('Every level names real songs', RR.LEVELS.every(l => l.songs.every(id => RR.SONGS[id])));

    // 4. practices are made safe
    const junk = RR.sanitize({ notes: ['X9', 'C4'], rhythms: ['qr'], tempos: [999, 10, 'x'], tempo: 90, judge: 'beat', time: [7, 8], colour: 'blue', flash: 5, bars: 3, endDo: 'yes', practice: 'no' });
    check('sanitize: junk is cleaned (and the old judge / tempo / three tempos are dropped)', junk.notes.join() === 'C4' && junk.rhythms.join() === RR.DEFAULTS.rhythms.join() &&
      !('tempos' in junk) && !('judge' in junk) && !('tempo' in junk) && junk.practice === true &&
      junk.time[0] === 4 && junk.colour === 'always' && junk.flash === 0 && junk.bars === 1 && junk.endDo === true, JSON.stringify(junk).slice(0, 120));
    check('sanitize: a practice’s three tempos (Slow · Moderate · Fast, before the dial) are gone, old links too', !('tempos' in RR.sanitize({ tempos: [200, 30, 90] })) && !('tempos' in RR.DEFAULTS));
    check('Practice on every level but the last (sight-reading)', RR.LEVELS.every(l => l.practice === (l.n !== 15)));
    const six = RR.sanitize({ time: [6, 8] }), both = RR.sanitize({ times: [[6, 8], [4, 4], [5, 4]], leaps: ['M6', 'x'], pickup: true }), none = RR.sanitize({ leaps: [], times: [[9, 8]] });
    check('sanitize: 6/8, more than one meter, pick-ups and leaps', six.time.join('/') === '6/8' && six.times.length === 1 &&
      both.time.join('/') === '4/4' && both.times.map(t => t.join('/')).join() === '4/4,6/8' && both.leaps.join() === 'M6' && both.pickup === true &&
      none.leaps.join() === 'P4,P5' && none.times.map(t => t.join('/')).join() === '4/4' && RR.sanitize({ time: [3, 4] }).times[0].join('/') === '3/4');
    check('sanitize: nothing gives the defaults', JSON.stringify(RR.sanitize(null)) === JSON.stringify(RR.DEFAULTS));
    check('trimPractice of the defaults is empty', Object.keys(RR.trimPractice(RR.clone(RR.DEFAULTS))).length === 0);
    RR.LEVELS.forEach(l => {
      const p = RR.practiceOfLevel(l.n);
      if (JSON.stringify(RR.sanitize(p)) !== JSON.stringify(p)) check('Level ' + l.n + ' survives sanitize unchanged', false);
    });
    check('Every level survives sanitize unchanged', RR.LEVELS.every(l => { const p = RR.practiceOfLevel(l.n); return JSON.stringify(RR.sanitize(p)) === JSON.stringify(p); }));

    // 5. lesson links round-trip
    RR.LEVELS.forEach(l => {
      const p = RR.practiceOfLevel(l.n);
      const link = RR.Lesson.link('Week 3 — Café', p);
      const back = RR.Lesson.parse(link);
      if (!back || back.name !== 'Week 3 — Café' || JSON.stringify(back.practice) !== JSON.stringify(p)) check('Lesson link for level ' + l.n, false, link);
    });
    check('Lesson links round-trip for every level (with a non-ASCII name)', true, 'e.g. ' + RR.Lesson.link('Week 3', RR.practiceOfLevel(9)).length + ' characters for Level 9');
    const broken = RR.Lesson.parse(location.href.split('?')[0] + '?lesson=X&p=%%%');
    check('A broken lesson link still opens, with the usual settings', broken && broken.bad && JSON.stringify(broken.practice) === JSON.stringify(RR.DEFAULTS));

    // 6. engraving of the hard cases
    const hard = { time: [4, 4], notes: [{ p: 'C4', t: 1 }, { p: 'D4', t: 1 }, { p: 'E4', t: 2 }, { p: 'G5', t: 6 }, { p: 'F5', t: 2 }, { p: null, t: 4 }, { p: 'B4', t: 16 }] };
    let ok = true; try { RR.Eng.render(hard, { ss: 22, maxW: 300, colour: 'black', labels: 'letters', judgeRow: true, ghosts: [{ id: 'A5', col: 0 }], playTick: 3 }); } catch (e) { ok = false; }
    check('Engraver: sixteenths, a dot, a rest, a whole note, a ghost, the playhead, squeezed', ok);
    check('Glyphs are loaded', RR.Eng.available);
    // 6/8 with a pick-up: the eighths beamed in threes, the pick-up's eighth alone, a dotted rest, a bar line after the pick-up
    const six8 = { time: [6, 8], pickup: 2, notes: [{ p: 'C4', t: 2 }, { p: 'E4', t: 2 }, { p: 'F4', t: 2 }, { p: 'G4', t: 2 }, { p: 'A4', t: 6 }, { p: null, t: 6 }, { p: 'B4', t: 4 }] };
    let g68 = null; try { g68 = RR.Eng.render(six8, { ss: 20, maxW: 700, colour: 'always' }); } catch (e) { g68 = null; }
    check('Engraver: 6/8 beams in threes; a pick-up stands before the first bar line; a dotted rest',
      g68 && g68.evs[0].beam === null && g68.evs[1].beam !== null && g68.evs[1].beam === g68.evs[3].beam &&
      g68.svg.split(GLYPHS_LELAND.augmentationDot.d).length - 1 === 2 &&                       // the dotted quarter's dot and the rest's
      RR.Eng.measure(six8).fixed > RR.Eng.measure({ time: [6, 8], notes: six8.notes.slice(1).concat({ p: 'C5', t: 2 }) }).fixed);

    // 7. My melodies: melody sets by the family library rules (phase 5)
    (function () {
      const S = RR.Sets, EVM = window.EVMLibrary;
      const ok1 = S.normalizeMelody({ time: [4, 4], notes: [{ p: 'E4', t: 4 }, { p: 'D4', t: 4 }, { p: 'C4', t: 8 }] });
      const cross = S.normalizeMelody({ time: [4, 4], notes: [{ p: 'E4', t: 12 }, { p: 'D4', t: 8 }, { p: 'C4', t: 12 }] });
      const short = S.normalizeMelody({ time: [4, 4], notes: [{ p: 'E4', t: 4 }] });
      const three = S.normalizeMelody({ time: [4, 4], notes: Array.from({ length: 12 }, () => ({ p: 'C4', t: 4 })) });
      const silent = S.normalizeMelody({ time: [3, 4], notes: [{ p: null, t: 4 }, { p: null, t: 8 }] });
      const junk = S.normalizeMelody({ time: [7, 8], notes: [{ p: 'Z9', t: 4 }, { p: 'G4', t: 4 }, { p: 'G4', t: 5 }, { p: 'G4', t: 8 }] });
      check('Sets: a melody fills one or two whole bars, never crosses a bar line, has a note',
        !!ok1 && !cross && !short && !three && !silent && !!junk && junk.time[0] === 4 && junk.notes.length === 3 && junk.notes[0].p === null,
        JSON.stringify(junk));
      const rec = S.normalize({ title: '  Week 3  ', melodies: [ok1, { junk: 1 }], received: true, book: 'B', derivedFrom: 'x' }, 'set_1');
      check('Sets: normalize keeps the library header (received, book, derivedFrom) and drops bad melodies',
        rec.title === 'Week 3' && rec.melodies.length === 1 && rec.received === true && rec.book === 'B' && rec.derivedFrom === 'x');
      check('Sets: a set with no melodies is blank (never filed)', S.key({ melodies: [] }) === null && S.key(rec) !== null);
      const k1 = S.key(rec), k2 = S.key(S.normalize(JSON.parse(JSON.stringify(rec)), 'other'));
      check('Sets: the content key ignores the id, the title and the dates', k1 === k2);

      // the filing rule, as a link arrives: added → same → updated → kept, and matched for id-less links
      const lib = {}, opts = { key: S.key, newId: () => EVM.newId('set'), received: true };
      const base = { id: 'set_100_aaaa', title: 'Week 3', createdAt: 100, updatedAt: 100, melodies: [ok1] };
      const a = EVM.file(lib, S.normalize(base, base.id), opts);
      const b = EVM.file(lib, S.normalize(base, base.id), opts);
      const newer = Object.assign({}, base, { updatedAt: 200, melodies: [ok1, ok1] });
      const c = EVM.file(lib, S.normalize(newer, newer.id), opts);
      const older = Object.assign({}, base, { updatedAt: 150, melodies: [ok1, ok1, ok1] });
      const d = EVM.file(lib, S.normalize(older, older.id), opts);
      const noId = S.normalize({ title: 'From an old link', melodies: [ok1, ok1] }, 'x'); delete noId.id; delete noId.createdAt; delete noId.updatedAt;
      const e = EVM.file(lib, noId, opts);
      check('Sets: a link filed twice is one set; newer replaces, older is kept; an id-less link matches by content',
        a.action === 'added' && b.action === 'same' && c.action === 'updated' && d.action === 'kept' && e.action === 'matched' &&
        Object.keys(lib).length === 1 && lib.set_100_aaaa.melodies.length === 2 && lib.set_100_aaaa.received === true,
        [a.action, b.action, c.action, d.action, e.action].join(' → '));

      // a lesson link carries the melodies, never the id
      const link = RR.Lesson.link('Week 4', Object.assign(RR.clone(RR.DEFAULTS), { set: 'set_100_aaaa' }), lib.set_100_aaaa);
      const back = RR.Lesson.parse(link);
      check('Lessons: a set travels as its melodies, not its library id',
        !link.includes('set_100_aaaa') && back.set && back.set.id === 'lesson' && back.set.melodies.length === 2 && back.practice.set === 'lesson');

      // envelopes: what the Librarian publishes, and back
      const env = EVM.toEnvelope(lib.set_100_aaaa, { app: 'rainbow-reader', kind: 'set', dataOf: r => ({ melodies: r.melodies }) });
      const round = S.normalize(EVM.fromEnvelope(env), env.id);
      check('Sets: a Librarian envelope comes back as the same set, shared', S.key(round) === S.key(lib.set_100_aaaa) && round.received === true && env.kind === 'set');
    })();

    // 8. the points: 1–20 a melody (points.js)
    (function () {
      const P = RR.Points;
      check('Points, tier 1: first try 1, second ½ → ⌊8 × credit ÷ notes⌋, never below 1',
        P.reading([0, 0, 0, 0]) === 8 && P.reading([0, 1, 0, 0]) === 7 && P.reading([1, 1, 1, 1]) === 4 && P.reading([2, 3, 2]) === 1 && P.reading([0, 0, 0, 1, 0, 0, 0, 0]) === 7,
        [P.reading([0, 0, 0, 0]), P.reading([0, 1, 0, 0]), P.reading([1, 1, 1, 1]), P.reading([2, 3, 2]), P.reading([0, 0, 0, 1, 0, 0, 0, 0])].join(' '));
      const starts = [0, 4, 8, 16, 20, 24];                    // q q h q q (+ a note on beat 7): a rhythm with a long note in it
      const at = (bpm, off) => starts.map((s, i) => s * 15 / bpm + (off ? off[i] : 0) * 60 / bpm);
      const exact = P.rhythm(starts, at(80)), slowE = P.rhythm(starts, at(50));
      const wobble = k => P.rhythm(starts, at(80, [0, k, -k, k, -k, 0]));
      const even = P.rhythm([0, 4, 8, 16], [0, 1, 2, 3].map(x => x * 0.75));
      const crawl = P.rhythm(starts, at(24));
      check('Points, tier 2: the right spacing at any steady tempo is 12', exact.grade === 12 && slowE.grade === 12 && Math.abs(exact.bpm - 80) < 0.01, exact.err.toFixed(3) + ' at ' + exact.bpm.toFixed(0));
      const g = [0.03, 0.1, 0.16, 0.24, 0.4].map(k => wobble(k));
      check('Points, tier 2: the further from the spacing, the fewer points (12 → 8)', g.every((x, i) => !i || x.grade <= g[i - 1].grade) && g[0].grade === 12 && g[4].grade === 8,
        g.map(x => x.grade + ' (' + x.err.toFixed(2) + ')').join(' · '));
      check('Points, tier 2: q q h q played evenly (no long note) is 8', even.grade === 8, 'off by ' + even.err.toFixed(2) + ' of a beat');
      check('Points, tier 2: slower than 30 BPM is finding, not a beat → 8', crawl.grade === 8);
      check('Points, tier 2: fewer than three notes have no rhythm to judge → 12', P.rhythm([0, 8], [0, 3]).grade === 12);
      // the score (2026-10-13, the user's): the same with the metronome or without — every note first time and in
      // rhythm goes by the player's tempo: about 100 or faster up to 20, 70–100 up to 17, under 70 up to 15
      const sc = (bpm, o) => P.score(Object.assign({ tries: starts.map(() => 0), starts, times: at(bpm) }, o || {}));
      const s104 = sc(104), s100 = sc(100), s98 = sc(98), s96 = sc(96), s80 = sc(80), s70 = sc(70), s69 = sc(69), s56 = sc(56);
      check('Every note first time, in rhythm, on your own: by the tempo — 100 or faster 20, 70–99 17, under 70 15',
        s104.pts === 20 && s100.pts === 20 && s98.pts === 20 && s96.pts === 17 && s80.pts === 17 && s70.pts === 17 && s69.pts === 15 && s56.pts === 15 && s80.tier === 3 && s80.pace === 'moderate' && s104.pace === 'fast',
        [s104, s100, s98, s96, s80, s70, s69, s56].map(x => x.pts).join(' · '));
      check('The same with the metronome: playing along at its tempo scores as on your own (80 → 17, 104 → 20)',

    /* ---- everything editable from the Library (2026-10-13): the app's own songs and lessons, and your copies ---- */
    (function () {
      const KEYS = [RR.Sets.KEY, 'rainbow_reader_teach_units_v1'];
      const was = KEYS.map(k => localStorage.getItem(k));
      try {
        KEYS.forEach(k => localStorage.removeItem(k)); RR.TeachUnits.load();
        const song = RR.Sets.get('songbook:hot-cross-buns'), lesson = RR.Sets.get('practice:L1');
        check('The Songbook’s songs and Practice’s lessons read as sets of their own — never stored',
          song && song.builtIn === 'song' && song.title === 'Hot Cross Buns' && song.melodies.length === RR.Melody.songCards('hot-cross-buns').length &&
          lesson && lesson.builtIn === 'lesson' && lesson.title === 'Level 1 · Mi and So' && lesson.melodies.length === 5 && lesson.melodies.every(m => m.time.join('/') === '4/4') &&
          RR.Sets.list().length === 0 && !RR.Sets.get('songbook:nope') && !RR.Sets.get('practice:L9') && RR.Sets.isBuiltIn('practice:A3'));
        check('Every Songbook song and every lesson reads as a set, its melodies all kept',
          Object.keys(RR.SONGS).every(k => RR.Sets.get('songbook:' + k).melodies.length === RR.Melody.songCards(k).length) &&
          RR.TEACH.every(L => RR.Sets.get('practice:' + L.id).melodies.length === L.ex.length));
        const told = []; RR.Sets.onCopied((from, rec) => told.push(from + '>' + rec.title));
        const c1 = RR.Sets.update('songbook:hot-cross-buns', x => { x.melodies.splice(1, 1); });
        check('Changing the app’s own song makes your copy — “Hot Cross Buns (my copy)”, the change in it, derivedFrom the song — and the song stays as it was',
          c1 && c1.title === 'Hot Cross Buns (my copy)' && c1.derivedFrom === 'songbook:hot-cross-buns' && c1.melodies.length === song.melodies.length - 1 &&
          RR.Sets.get('songbook:hot-cross-buns').melodies.length === song.melodies.length && RR.Sets.copyOf(RR.Sets.get(c1.id)) === 'songbook:hot-cross-buns' &&
          told[0] === 'songbook:hot-cross-buns>Hot Cross Buns (my copy)');
        const c2 = RR.Sets.update('songbook:hot-cross-buns', x => { x.melodies[0].notes[0].p = 'G4'; });
        const c3 = RR.Sets.update(c1.id, x => { x.melodies.pop(); });
        check('A second change to the original is a second copy (my copy 2); a change to your copy stays in it',
          c2.title === 'Hot Cross Buns (my copy 2)' && c3.id === c1.id && RR.Sets.list().length === 2);
        const songs = RR.teachSongs().map(L => L.id), at = songs.indexOf('S:hot-cross-buns');
        check('Your copies sit right after their song in Songs (as your sets), in the order made',
          songs[at + 1] === 'M:' + c1.id && songs[at + 2] === 'M:' + c2.id && RR.teachLevel('M:' + c1.id).copyOf === 'songbook:hot-cross-buns' &&
          RR.teachTabOf('M:' + c1.id) === 'songs' && songs.filter(id => /^S:/.test(id)).length === Object.keys(RR.SONGS).length);
        const l1 = RR.Sets.update('practice:L1', x => { x.title = 'My Mi and So'; });
        const lessons = RR.teachLessons().map(L => L.id), li = lessons.indexOf('L1');
        check('Changing a lesson (its name, here) makes your copy, one of Practice’s at once, right after the lesson — not with your exercises',
          l1.title === 'My Mi and So' && l1.derivedFrom === 'practice:L1' && RR.TeachUnits.has(l1.id) && lessons[li + 1] === 'U:' + l1.id && lessons[li + 2] === 'A1' &&
          !RR.teachExercises().some(L => L.id === 'U:' + l1.id) && RR.teachTabOf('U:' + l1.id) === 'lessons' && RR.teachLevel('U:' + l1.id).ex.length === 5);
        // a lesson's copy back from a backup (no unit record): with the lessons again
        RR.TeachUnits.remove(l1.id);
        const again = RR.teachLessons().map(L => L.id);
        check('A lesson’s copy that came back without its place in Practice (a backup) is put back with its lesson',
          again[again.indexOf('L1') + 1] === 'U:' + l1.id && RR.TeachUnits.has(l1.id));
        const own = RR.Sets.create('Week 3', [{ title: '', time: [4, 4], notes: [{ p: 'E4', t: 16 }] }]); RR.TeachUnits.add(own.id);
        check('Your own sets aren’t copies; an exercise of yours stays with your exercises', !RR.Sets.copyOf(own) && RR.teachExercises().some(L => L.id === 'U:' + own.id) && RR.teachTabOf('U:' + own.id) === 'exercises');
      } finally {
        KEYS.forEach((k, i) => { if (was[i] == null) localStorage.removeItem(k); else localStorage.setItem(k, was[i]); });
        RR.TeachUnits.load();
      }
    })();

    /* ---- the drum beat (2026-10-13): the user's Ostinato Builder beats, one for each meter ---- */
    (async function () {
      const D = RR.Drums, b = D.bars([4, 4]);
      const at = (bars, id) => bars.map((bar, i) => bar.filter(h => h.id === id).map(h => (i ? i + ':' : '') + +h.tick.toFixed(2)).join(' ')).filter(Boolean).join(' | ');
      check('The 4/4 drum beat: bass 1, 3 and the and of 4 · snare 2 and 4 · tom the last sixteenth of 1 and 2, the and of 3 and 4 · hi-hat every eighth',
        b.length === 1 && at(b, 'bass') === '0 8 14' && at(b, 'snare') === '4 12' && at(b, 'tom') === '3 7 10 14' && at(b, 'hihat') === '0 2 4 6 8 10 12 14' &&
        b[0].every((h, i) => !i || h.tick >= b[0][i - 1].tick) && b[0].every(h => VirtualInstruments.INSTRUMENT_IDS.includes(h.id)), b[0].length + ' hits');
      check('Each hit knows how far it is to its drum’s next one, round the bar (the kit’s fast-repeat sound): hi-hat 2, snare 8, tom 4 · 3 · 4 · 5, bass 8 · 6 · 2',
        b[0].filter(h => h.id === 'hihat').every(h => h.gap === 2) && b[0].filter(h => h.id === 'snare').every(h => h.gap === 8) &&
        b[0].filter(h => h.id === 'tom').map(h => h.gap).join() === '4,3,4,5' && b[0].filter(h => h.id === 'bass').map(h => h.gap).join() === '8,6,2');
      const t3 = D.bars([3, 4]), t2 = D.bars([2, 4]), t6 = D.bars([6, 8]);
      check('3/4 (the user’s shortened one, a bar): bass 1 and the and of 3 · snare 2 and 3 · tom the last sixteenth of 2 and 3 · hi-hat 1, its and, the and-a of 2, 3 e and',
        t3.length === 1 && at(t3, 'bass') === '0 10' && at(t3, 'snare') === '4 8' && at(t3, 'tom') === '7 11' && at(t3, 'hihat') === '0 2 6 7 8 9 10' &&
        t3[0].filter(h => h.id === 'bass').pop().gap === 2, at(t3, 'hihat'));
      check('2/4: bass 1 · snare 2 · tom the last sixteenth of 1, the and of 2 · hi-hat 1, its and, the and-a of 2',
        t2.length === 1 && at(t2, 'bass') === '0' && at(t2, 'snare') === '4' && at(t2, 'tom') === '3 6' && at(t2, 'hihat') === '0 2 6 7');
      check('6/8: bass 1 · snare 4 · tom 3, 5, 6 · hi-hat every eighth (2 ticks apart, a dotted quarter 6)',
        t6.length === 1 && at(t6, 'bass') === '0' && at(t6, 'snare') === '6' && at(t6, 'tom') === '4 8 10' && at(t6, 'hihat') === '0 2 4 6 8 10');
      check('Every meter Melody Reader plays has a drum beat (2/4, 3/4, 4/4, 6/8); one without would click',
        RR.METERS.map(RR.meterText).join() === '2/4,3/4,4/4,6/8' && RR.METERS.every(t => D.has(t)) && !D.has([5, 4]));
      check('The metronome’s sound is a practice’s own: Click unless it says Drum beat (old practices, every level: Click)',
        RR.DEFAULTS.beat === 'click' && RR.sanitize({ beat: 'drums' }).beat === 'drums' && RR.sanitize({ beat: 'bongos' }).beat === 'click' && RR.sanitize({}).beat === 'click' &&
        RR.LEVELS.every(l => RR.originalLevel(l.n).beat === 'click') && RR.TEACH_LOOK.beat === 'click');
      // the user's Ostinato Builder files, read as they are (only the bars each song plays)
      // in the order they came: a later file's beat for a meter replaces an earlier one (3/4 was shortened)
      const songs = [], newest = {}, key = o => RR.meterText(o.time);
      for (const f of ['drum-beat-4-4.json', 'drum-beats-6-8-2-4-3-4.json', 'drum-beat-3-4.json']) {
        try { songs.push.apply(songs, (await (await fetch('drum-beats/' + f)).json()).songs); } catch (e) { /* checked below */ }
      }
      songs.forEach(x => { const o = D.fromOstinato(x); newest[key(o)] = o; });
      const read = Object.keys(newest).map(k => newest[k]);
      check('Each drum beat is the user’s Ostinato Builder file as it is (tests/drum-beats/: 4/4; 6/8, 2/4 and a two-bar 3/4; then the shortened 3/4 — no links; beats past a song’s end left out)',
        songs.length === 5 && read.length === 4 && read.every(o => RR.DRUM_BEATS[key(o)] && JSON.stringify(o.lines) === JSON.stringify(RR.DRUM_BEATS[key(o)].lines)) &&
        songs.every(x => x.tracks.every(t => !Object.keys(t.links || {}).length)) && read.map(key).sort().join() === '2/4,3/4,4/4,6/8',
        read.map(o => key(o) + ' ' + (RR.DRUM_BEATS[key(o)] && JSON.stringify(o.lines) === JSON.stringify(RR.DRUM_BEATS[key(o)].lines) ? '✓' : '✗')).join(' · '));
      // a beat of more than a bar goes round (the 3/4 was two bars once); a bar with nothing in it holds its place
      RR.DRUM_BEATS['5/4'] = { title: 'test', lines: { snare: 'x-|--|--|--|--|--|--|--|--|--', tom: '--|--|--|--|--|-x|--|--|--|--' } };
      const five = D.bars([5, 4]);
      RR.DRUM_BEATS['5/4'] = { title: 'test', lines: { snare: 'x-|--|--|--|--|--|--|--|--|--' } };
      const rest = D.bars([5, 4]); delete RR.DRUM_BEATS['5/4'];
      check('A beat of two bars goes round (each drum’s gap reaching across the bar line and back round); a bar with nothing in it holds its place (a rest)',
        five.length === 2 && five[0][0].id === 'snare' && five[0][0].gap === 40 && five[1][0].id === 'tom' && five[1][0].tick === 2 && five[1][0].gap === 40 &&
        rest.length === 2 && rest[1].length === 1 && rest[1][0].rest === true);

      document.getElementById('sum').innerHTML = '<span class="' + (fail ? 'fail' : 'pass') + '">' + pass + ' passed, ' + fail + ' failed</span>';
      document.title = (fail ? 'FAIL ' : 'PASS ') + document.title;
    })();
  })();
  </script>
</body>
</html>
